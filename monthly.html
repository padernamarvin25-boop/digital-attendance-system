<!DOCTYPE html>
<html>
<head>
    <title>Monthly Attendance Record</title>
</head>

<body>

<h1>Monthly Attendance Record</h1>

<label>Select Month:</label>
<br><br>

<input type="month" id="month">

<button onclick="showMonthlyRecord()">
    VIEW MONTHLY RECORD
</button>

<br><br>

<h2>Attendance Summary</h2>

<table border="1" width="100%" cellpadding="10">

    <thead>
        <tr>
            <th>Employee ID</th>
            <th>Employee Name</th>
            <th>Present</th>
            <th>Absent</th>
        </tr>
    </thead>

    <tbody id="summaryTable">
    </tbody>

</table>

<br><br>

<h2>Daily Attendance</h2>

<table border="1" width="100%" cellpadding="10">

    <thead>
        <tr>
            <th>Employee ID</th>
            <th>Employee Name</th>
            <th>Date</th>
            <th>Time In</th>
            <th>Time Out</th>
            <th>Status</th>
        </tr>
    </thead>

    <tbody id="monthlyTable">
    </tbody>

</table>

<br>

<a href="dashboard.html">BACK TO DASHBOARD</a>

<script>

function showMonthlyRecord() {

    let selectedMonth =
        document.getElementById("month").value;

    if (selectedMonth === "") {
        alert("Please select a month.");
        return;
    }

    let employees =
        JSON.parse(localStorage.getItem("employees")) || [];

    let records =
        JSON.parse(localStorage.getItem("attendanceRecords")) || [];

    let summaryTable =
        document.getElementById("summaryTable");

    let monthlyTable =
        document.getElementById("monthlyTable");

    summaryTable.innerHTML = "";
    monthlyTable.innerHTML = "";

    if (employees.length === 0) {

        let row = summaryTable.insertRow();
        let cell = row.insertCell(0);

        cell.colSpan = 4;
        cell.innerHTML = "No registered employees.";

        return;
    }

    let parts = selectedMonth.split("-");

    let year = parseInt(parts[0]);
    let month = parseInt(parts[1]);

    let daysInMonth =
        new Date(year, month, 0).getDate();

    let presentTotal = 0;
    let absentTotal = 0;

    employees.forEach(function(employee) {

        let present = 0;
        let absent = 0;

        for (let day = 1; day <= daysInMonth; day++) {

            let currentDate =
                new Date(year, month - 1, day);

            let dayOfWeek =
                currentDate.getDay();

            // Monday to Friday only
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                continue;
            }

            let dateString =
                (month < 10 ? "0" : "") + month + "/" +
                (day < 10 ? "0" : "") + day + "/" +
                year;

            let attendance = records.find(function(record) {

                return record.employeeId === employee.id &&
                       record.date === dateString;

            });

            let row = monthlyTable.insertRow();

            row.insertCell(0).innerHTML =
                employee.id;

            row.insertCell(1).innerHTML =
                employee.name;

            row.insertCell(2).innerHTML =
                dateString;

            if (attendance) {

                present++;

                row.insertCell(3).innerHTML =
                    attendance.timeIn;

                row.insertCell(4).innerHTML =
                    attendance.timeOut || "Not yet";

                row.insertCell(5).innerHTML =
                    "Present";

            } else {

                absent++;

                row.insertCell(3).innerHTML =
                    "-";

                row.insertCell(4).innerHTML =
                    "-";

                row.insertCell(5).innerHTML =
                    "Absent";
            }

        }

        presentTotal += present;
        absentTotal += absent;

        let summaryRow =
            summaryTable.insertRow();

        summaryRow.insertCell(0).innerHTML =
            employee.id;

        summaryRow.insertCell(1).innerHTML =
            employee.name;

        summaryRow.insertCell(2).innerHTML =
            present;

        summaryRow.insertCell(3).innerHTML =
            absent;

    });

    let totalRow =
        summaryTable.insertRow();

    totalRow.insertCell(0).innerHTML = "";
    totalRow.insertCell(1).innerHTML = "TOTAL";
    totalRow.insertCell(2).innerHTML = presentTotal;
    totalRow.insertCell(3).innerHTML = absentTotal;

}

</script>

</body>
</html>
