<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Record</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    color: #222;
}

header {
    background: #0b1f3a;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

.container {
    width: 95%;
    max-width: 1100px;
    margin: 30px auto;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h2 {
    color: #0b1f3a;
    margin-top: 0;
}

/* FOLDER */

.folder-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    margin-top: 25px;
}

.folder {
    background: #eef3f8;
    border: 2px solid #d6e0ea;
    border-radius: 12px;
    padding: 30px 15px;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
}

.folder:hover {
    background: #e3ebf4;
    transform: translateY(-3px);
}

.folder-icon {
    font-size: 45px;
    margin-bottom: 10px;
}

.folder-name {
    font-size: 18px;
    font-weight: bold;
    color: #0b1f3a;
}

/* HIDDEN SECTIONS */

#employeeView,
#recordView {
    display: none;
}

/* BUTTON */

.back-btn {
    background: #0b1f3a;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 7px;
    cursor: pointer;
    margin-bottom: 20px;
}

.back-btn:hover {
    background: #163b6d;
}

/* TABLE */

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th {
    background: #0b1f3a;
    color: white;
    padding: 13px;
    text-align: left;
}

td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
}

tr:hover {
    background: #f5f7fa;
}

/* CLICKABLE NAME */

.employee-name {
    color: #0b1f3a;
    font-weight: bold;
    cursor: pointer;
}

.employee-name:hover {
    text-decoration: underline;
}

/* STATUS */

.present {
    color: green;
    font-weight: bold;
}

.absent {
    color: red;
    font-weight: bold;
}

/* MONTH SELECT */

.month-box {
    margin: 15px 0 20px;
}

.month-box label {
    font-weight: bold;
    margin-right: 8px;
}

select {
    padding: 9px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

.no-record {
    text-align: center;
    color: #777;
    padding: 25px;
}

.dashboard-btn {
    margin-top: 20px;
}

@media(max-width: 600px) {

    th,
    td {
        font-size: 13px;
        padding: 9px;
    }

}
</style>
</head>

<body>

<header>
    <h1>Monthly Attendance Record</h1>
</header>


<div class="container">

    <!-- =========================
         DEPARTMENT FOLDERS
    ========================== -->

    <div class="card" id="departmentView">

        <h2>Select Department</h2>

        <div class="folder-container">

            <div class="folder"
                 onclick="openDepartment('BSCRIM')">
                <div class="folder-icon">📁</div>
                <div class="folder-name">BSCRIM</div>
            </div>

            <div class="folder"
                 onclick="openDepartment('BSIT')">
                <div class="folder-icon">📁</div>
                <div class="folder-name">BSIT</div>
            </div>

            <div class="folder"
                 onclick="openDepartment('BSHM')">
                <div class="folder-icon">📁</div>
                <div class="folder-name">BSHM</div>
            </div>

            <div class="folder"
                 onclick="openDepartment('BSED')">
                <div class="folder-icon">📁</div>
                <div class="folder-name">BSED</div>
            </div>

            <div class="folder"
                 onclick="openDepartment('BSBA')">
                <div class="folder-icon">📁</div>
                <div class="folder-name">BSBA</div>
            </div>

            <div class="folder"
                 onclick="openDepartment('BEED')">
                <div class="folder-icon">📁</div>
                <div class="folder-name">BEED</div>
            </div>

        </div>

        <button class="back-btn dashboard-btn"
                onclick="goDashboard()">
            ← Back to Dashboard
        </button>

    </div>


    <!-- =========================
         EMPLOYEE TABLE
    ========================== -->

    <div class="card" id="employeeView">

        <button class="back-btn"
                onclick="backToDepartments()">
            ← Back to Departments
        </button>

        <h2 id="employeeTitle">
            Registered Employees
        </h2>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Employee ID</th>
                        <th>Employee Name</th>
                        <th>Position</th>
                        <th>Department</th>
                    </tr>
                </thead>

                <tbody id="employeeTable">
                </tbody>

            </table>

        </div>

    </div>


    <!-- =========================
         EMPLOYEE MONTHLY RECORD
    ========================== -->

    <div class="card" id="recordView">

        <button class="back-btn"
                onclick="backToEmployees()">
            ← Back to Employees
        </button>

        <h2 id="recordTitle">
            Employee Monthly Record
        </h2>

        <div class="month-box">

            <label for="monthSelect">
                Select Month:
            </label>

            <select id="monthSelect"
                    onchange="loadRecords()">
            </select>

        </div>

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>Date</th>
                        <th>Time In</th>
                        <th>Time Out</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody id="recordTable">
                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

let selectedDepartment = "";
let selectedEmployee = null;


/* =========================
   OPEN DEPARTMENT
========================= */

function openDepartment(department) {

    selectedDepartment = department;

    document.getElementById("departmentView")
        .style.display = "none";

    document.getElementById("employeeView")
        .style.display = "block";

    document.getElementById("recordView")
        .style.display = "none";

    document.getElementById("employeeTitle").textContent =
        department + " Registered Employees";

    loadEmployees(department);
}


/* =========================
   LOAD REGISTERED EMPLOYEES
========================= */

function loadEmployees(department) {

    const employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );

    const table =
        document.getElementById("employeeTable");

    table.innerHTML = "";


    const departmentEmployees =
        employees
        .filter(employee =>
            employee.department === department
        )
        .sort((a, b) =>
            String(a.name).localeCompare(
                String(b.name)
            )
        );


    if (departmentEmployees.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="4"
                    class="no-record">
                    No registered employees
                    in ${department}.
                </td>
            </tr>
        `;

        return;
    }


    departmentEmployees.forEach(employee => {

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${employee.id}
            </td>

            <td
                class="employee-name"
                onclick="openEmployee('${employee.id}')">

                ${employee.name}

            </td>

            <td>
                ${employee.position || "-"}
            </td>

            <td>
                ${employee.department}
            </td>

        `;


        table.appendChild(row);

    });
}


/* =========================
   OPEN EMPLOYEE RECORD
========================= */

function openEmployee(employeeId) {

    const employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );


    selectedEmployee =
        employees.find(employee =>
            String(employee.id) ===
            String(employeeId)
        );


    if (!selectedEmployee) {
        return;
    }


    document.getElementById("employeeView")
        .style.display = "none";

    document.getElementById("recordView")
        .style.display = "block";


    document.getElementById("recordTitle").textContent =
        selectedEmployee.name +
        " - Monthly Attendance";


    createMonthOptions();

    loadRecords();
}


/* =========================
   CREATE MONTH OPTIONS
========================= */

function createMonthOptions() {

    const select =
        document.getElementById("monthSelect");

    select.innerHTML = "";


    const records =
        JSON.parse(
            localStorage.getItem("attendanceRecords") || "[]"
        );


    const months = new Set();


    records.forEach(record => {

        if (
            String(record.employeeId) ===
            String(selectedEmployee.id)
        ) {

            if (record.attendanceDate) {

                months.add(
                    record.attendanceDate.substring(0, 7)
                );

            }

        }

    });


    // Always include current month

    const now = new Date();

    const currentMonth =
        now.getFullYear() +
        "-" +
        String(now.getMonth() + 1)
            .padStart(2, "0");


    months.add(currentMonth);


    Array.from(months)
        .sort()
        .reverse()
        .forEach(month => {

            const option =
                document.createElement("option");

            option.value = month;

            option.textContent =
                formatMonth(month);

            select.appendChild(option);

        });


    select.value = currentMonth;
}


/* =========================
   FORMAT MONTH
========================= */

function formatMonth(month) {

    const parts =
        month.split("-");

    const year =
        Number(parts[0]);

    const monthNumber =
        Number(parts[1]) - 1;


    const date =
        new Date(
            year,
            monthNumber,
            1
        );


    return date.toLocaleDateString(
        "en-US",
        {
            month: "long",
            year: "numeric"
        }
    );
}


/* =========================
   LOAD MONTHLY RECORD
========================= */

function loadRecords() {

    const selectedMonth =
        document.getElementById("monthSelect").value;


    const records =
        JSON.parse(
            localStorage.getItem("attendanceRecords") || "[]"
        );


    const table =
        document.getElementById("recordTable");

    table.innerHTML = "";


    const employeeRecords =
        records.filter(record => {

            return (
                String(record.employeeId) ===
                String(selectedEmployee.id)
            )
            &&
            String(record.attendanceDate || "")
                .startsWith(selectedMonth);

        });


    employeeRecords.sort((a, b) =>
        String(a.attendanceDate)
            .localeCompare(
                String(b.attendanceDate)
            )
    );


    if (employeeRecords.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="4"
                    class="no-record">
                    No attendance records
                    for this month.
                </td>
            </tr>
        `;

        return;
    }


    employeeRecords.forEach(record => {

        const row =
            document.createElement("tr");


        const statusClass =
            record.status === "Present"
            ? "present"
            : "absent";


        row.innerHTML = `

            <td>
                ${record.date ||
                 record.attendanceDate ||
                 "-"}
            </td>

            <td>
                ${record.timeIn || "-"}
            </td>

            <td>
                ${record.timeOut || "-"}
            </td>

            <td class="${statusClass}">
                ${record.status || "-"}
            </td>

        `;


        table.appendChild(row);

    });
}


/* =========================
   BACK TO DEPARTMENTS
========================= */

function backToDepartments() {

    document.getElementById("departmentView")
        .style.display = "block";

    document.getElementById("employeeView")
        .style.display = "none";

    document.getElementById("recordView")
        .style.display = "none";

}


/* =========================
   BACK TO EMPLOYEES
========================= */

function backToEmployees() {

    document.getElementById("departmentView")
        .style.display = "none";

    document.getElementById("employeeView")
        .style.display = "block";

    document.getElementById("recordView")
        .style.display = "none";

    loadEmployees(selectedDepartment);
}


/* =========================
   DASHBOARD
========================= */

function goDashboard() {

    window.location.href =
        "dashboard.html";

}

</script>

</body>
</html>
