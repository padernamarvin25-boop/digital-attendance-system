<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Attendance Record</title> <style> * { box-sizing: border-box; font-family: Arial, sans-serif; } body { margin: 0; background: #f3f6fa; color: #222; } header { background: #12355b; color: white; padding: 25px 20px; text-align: center; } header h1 { margin: 0; font-size: 28px; } header p { margin: 8px 0 0; font-size: 14px; } .container { max-width: 1150px; margin: 30px auto; padding: 0 15px; } .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 5px 18px rgba(0,0,0,0.08); } .card h2 { margin-top: 0; color: #12355b; } .table-container { overflow-x: auto; margin-top: 20px; } table { width: 100%; border-collapse: collapse; min-width: 750px; } th { background: #12355b; color: white; padding: 14px; text-align: center; } td { padding: 13px; border-bottom: 1px solid #ddd; text-align: center; } tr:hover { background: #f6f9fc; } .present { color: #16803c; font-weight: bold; } .absent { color: #d62828; font-weight: bold; } .summary { display: flex; gap: 20px; margin-top: 25px; flex-wrap: wrap; } .summary-box { flex: 1; min-width: 220px; padding: 20px; border-radius: 12px; text-align: center; } .summary-box h3 { margin: 0 0 8px; font-size: 15px; } .summary-box span { font-size: 28px; font-weight: bold; } .present-box { background: #e8f7ed; color: #16803c; } .absent-box { background: #fdeaea; color: #d62828; } .back-btn { display: inline-block; margin-top: 25px; padding: 12px 20px; background: #12355b; color: white; text-decoration: none; border-radius: 8px; } .back-btn:hover { background: #0d2946; } .no-record { padding: 30px; color: #777; } </style> </head> <body> <header> <h1>Digital Attendance System</h1> <p>Faculty and Staff Attendance Record</p> </header> <div class="container"> <div class="card"> <h2>Attendance Record</h2> <div class="table-container"> <table> <thead> <tr> <th>Employee ID</th> <th>Employee Name</th> <th>Date</th> <th>Time In</th> <th>Time Out</th> <th>Status</th> </tr> </thead> <tbody id="attendanceTable"> </tbody> </table> </div> <div class="summary"> <div class="summary-box present-box"> <h3>TOTAL PRESENT</h3> <span id="totalPresent">0</span> </div> <div class="summary-box absent-box"> <h3>TOTAL ABSENT</h3> <span id="totalAbsent">0</span> </div> </div> <a href="dashboard.html" class="back-btn"> ← BACK TO DASHBOARD </a> </div> </div> <script> function loadAttendance() { const employees = JSON.parse(localStorage.getItem("employees")) || []; const records = JSON.parse(localStorage.getItem("attendanceRecords")) || []; const table = document.getElementById("attendanceTable"); table.innerHTML = ""; let totalPresent = 0; let totalAbsent = 0; /* Sort attendance alphabetically according to employee name. / records.sort(function(a, b) { return a.employeeName.localeCompare( b.employeeName ); }); / If there are no attendance records. */ if (records.length === 0) { table.innerHTML =  <tr> <td colspan="6" class="no-record"> No attendance records yet. </td> </tr> ; return; } /* Display every attendance record. Employee ID and Employee Name are ALWAYS displayed. */ records.forEach(function(record) { const row = document.createElement("tr"); let status = record.status || "Present"; if (status === "Present") { totalPresent++; } else if (status === "Absent") { totalAbsent++; } row.innerHTML =  <td> ${record.employeeId || "-"} </td> <td> ${record.employeeName || "-"} </td> <td> ${record.date || "-"} </td> <td> ${record.timeIn || "-"} </td> <td> ${record.timeOut || "-"} </td> <td class="${ status === "Present" ? "present" : "absent" }"> ${status} </td> ; table.appendChild(row); }); document.getElementById("totalPresent").textContent = totalPresent; document.getElementById("totalAbsent").textContent = totalAbsent; } loadAttendance(); </script> </body> </html>
