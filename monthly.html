<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monthly Attendance Record</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f3f6fa;
    color: #222;
}

header {
    background: #12355b;
    color: white;
    padding: 25px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 8px 0 0;
    font-size: 14px;
}

.container {
    max-width: 1150px;
    margin: 30px auto;
    padding: 0 15px;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 25px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

.card h2 {
    color: #12355b;
    margin-top: 0;
}

.filter {
    display: flex;
    gap: 12px;
    align-items: center;
    margin: 20px 0;
    flex-wrap: wrap;
}

.filter label {
    font-weight: bold;
    color: #12355b;
}

select {
    padding: 11px 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 850px;
}

th {
    background: #12355b;
    color: white;
    padding: 13px;
    text-align: center;
}

td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

tr:hover {
    background: #f6f9fc;
}

.present {
    color: #16803c;
    font-weight: bold;
}

.absent {
    color: #d62828;
    font-weight: bold;
}

.summary {
    display: flex;
    gap: 20px;
    margin-top: 25px;
    flex-wrap: wrap;
}

.summary-box {
    flex: 1;
    min-width: 200px;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
}

.summary-box h3 {
    margin: 0 0 8px;
    font-size: 15px;
}

.summary-box span {
    font-size: 28px;
    font-weight: bold;
}

.present-box {
    background: #e8f7ed;
    color: #16803c;
}

.absent-box {
    background: #fdeaea;
    color: #d62828;
}

.no-record {
    padding: 30px;
    color: #777;
}

.back-btn {
    display: inline-block;
    margin-top: 25px;
    padding: 12px 20px;
    background: #12355b;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

.back-btn:hover {
    background: #0d2946;
}

</style>
</head>

<body>

<header>
    <h1>Digital Attendance System</h1>
    <p>Faculty and Staff Monthly Attendance Record</p>
</header>


<div class="container">

    <div class="card">

        <h2>Monthly Attendance Record</h2>

        <div class="filter">

            <label for="monthSelect">
                Select Month:
            </label>

            <select id="monthSelect">
            </select>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>Employee ID</th>
                        <th>Employee Name</th>
                        <th>Date</th>
                        <th>Time In</th>
                        <th>Time Out</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody id="monthlyTable">
                </tbody>

            </table>

        </div>


        <div class="summary">

            <div class="summary-box present-box">

                <h3>TOTAL PRESENT</h3>

                <span id="totalPresent">0</span>

            </div>


            <div class="summary-box absent-box">

                <h3>TOTAL ABSENT</h3>

                <span id="totalAbsent">0</span>

            </div>

        </div>


        <a href="dashboard.html" class="back-btn">
            ← BACK TO DASHBOARD
        </a>

    </div>

</div>


<script>

const monthSelect =
    document.getElementById("monthSelect");


const months = [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December"
];


/*
   Create month options.
*/

months.forEach(function(month, index) {

    const option =
        document.createElement("option");

    option.value = index;

    option.textContent = month;

    monthSelect.appendChild(option);

});


/*
   Automatically select current month.
*/

const currentMonth = new Date().getMonth();

monthSelect.value = currentMonth;


/*
   Load monthly attendance.
*/

function loadMonthlyAttendance() {

    const selectedMonth =
        parseInt(monthSelect.value);

    const currentYear =
        new Date().getFullYear();


    const employees =
        JSON.parse(
            localStorage.getItem("employees")
        ) || [];


    const records =
        JSON.parse(
            localStorage.getItem("attendanceRecords")
        ) || [];


    const table =
        document.getElementById("monthlyTable");


    table.innerHTML = "";


    let totalPresent = 0;
    let totalAbsent = 0;


    /*
       Sort employees alphabetically.
    */

    employees.sort(function(a, b) {

        return a.name.localeCompare(b.name);

    });


    /*
       Get records for selected month.
    */

    const monthlyRecords =
        records.filter(function(record) {

            const recordDate =
                new Date(record.date);

            return (
                recordDate.getMonth() === selectedMonth &&
                recordDate.getFullYear() === currentYear
            );

        });


    /*
       If no records.
    */

    if (monthlyRecords.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="6" class="no-record">
                    No attendance records for
                    ${months[selectedMonth]}
                    ${currentYear}.
                </td>
            </tr>
        `;

    } else {

        /*
           Sort records alphabetically.
        */

        monthlyRecords.sort(function(a, b) {

            return a.employeeName.localeCompare(
                b.employeeName
            );

        });


        monthlyRecords.forEach(function(record) {

            const row =
                document.createElement("tr");


            const status =
                record.status || "Present";


            if (status === "Present") {
                totalPresent++;
            }


            if (status === "Absent") {
                totalAbsent++;
            }


            row.innerHTML = `

                <td>
                    ${record.employeeId || "-"}
                </td>

                <td>
                    ${record.employeeName || "-"}
                </td>

                <td>
                    ${record.date || "-"}
                </td>

                <td>
                    ${record.timeIn || "-"}
                </td>

                <td>
                    ${record.timeOut || "-"}
                </td>

                <td class="${
                    status === "Present"
                    ? "present"
                    : "absent"
                }">

                    ${status}

                </td>

            `;


            table.appendChild(row);

        });

    }


    document.getElementById("totalPresent")
        .textContent = totalPresent;


    document.getElementById("totalAbsent")
        .textContent = totalAbsent;

}


/*
   Change month.
*/

monthSelect.addEventListener(
    "change",
    loadMonthlyAttendance
);


/*
   Load when page opens.
*/

loadMonthlyAttendance();

</script>

</body>
</html>
