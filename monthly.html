<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monthly Attendance Record</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f3f6fa;
    color: #222;
}

header {
    background: #12355b;
    color: white;
    padding: 25px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 8px 0 0;
    font-size: 14px;
}

.container {
    max-width: 1150px;
    margin: 30px auto;
    padding: 0 15px;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 25px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

.card h2 {
    color: #12355b;
    margin-top: 0;
}

.filter {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    flex-wrap: wrap;
}

.filter label {
    font-weight: bold;
    color: #12355b;
}

select {
    padding: 11px 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

.employee-folder {
    border: 1px solid #d9e0e8;
    border-radius: 12px;
    margin-bottom: 15px;
    overflow: hidden;
}

.employee-header {
    background: #f7f9fc;
    padding: 17px 20px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.2s;
}

.employee-header:hover {
    background: #edf3f9;
}

.employee-info {
    display: flex;
    align-items: center;
    gap: 15px;
}

.folder-icon {
    font-size: 25px;
}

.employee-name {
    color: #12355b;
    font-size: 17px;
    font-weight: bold;
}

.employee-id {
    color: #777;
    font-size: 13px;
    margin-top: 4px;
}

.arrow {
    font-size: 18px;
    color: #12355b;
    transition: 0.2s;
}

.employee-folder.open .arrow {
    transform: rotate(90deg);
}

.employee-content {
    display: none;
    padding: 20px;
    background: white;
}

.employee-folder.open .employee-content {
    display: block;
}

.summary {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.summary-box {
    padding: 13px 20px;
    border-radius: 10px;
    font-weight: bold;
}

.present-box {
    background: #e8f7ed;
    color: #16803c;
}

.absent-box {
    background: #fdeaea;
    color: #d62828;
}

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 750px;
}

th {
    background: #12355b;
    color: white;
    padding: 12px;
    text-align: center;
}

td {
    padding: 11px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

.present {
    color: #16803c;
    font-weight: bold;
}

.absent {
    color: #d62828;
    font-weight: bold;
}

.no-record {
    text-align: center;
    padding: 20px;
    color: #777;
}

.back-btn {
    display: inline-block;
    margin-top: 25px;
    padding: 12px 20px;
    background: #12355b;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

.back-btn:hover {
    background: #0d2946;
}
</style>
</head>

<body>

<header>
    <h1>Digital Attendance System</h1>
    <p>Faculty and Staff Monthly Attendance Record</p>
</header>

<div class="container">

    <div class="card">

        <h2>Monthly Attendance Record</h2>

        <div class="filter">
            <label for="monthSelect">Select Month:</label>

            <select id="monthSelect">
            </select>
        </div>

        <div id="employeeList"></div>

        <a href="dashboard.html" class="back-btn">
            ← BACK TO DASHBOARD
        </a>

    </div>

</div>

<script>

const months = [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December"
];

const monthSelect =
    document.getElementById("monthSelect");

const employeeList =
    document.getElementById("employeeList");


/* Create month choices */

months.forEach(function(month, index) {

    const option =
        document.createElement("option");

    option.value = index;
    option.textContent = month;

    monthSelect.appendChild(option);

});


/* Select current month */

monthSelect.value = new Date().getMonth();


function loadMonthlyAttendance() {

    const selectedMonth =
        parseInt(monthSelect.value);

    const selectedYear =
        new Date().getFullYear();


    const employees =
        JSON.parse(
            localStorage.getItem("employees")
        ) || [];


    const records =
        JSON.parse(
            localStorage.getItem("attendanceRecords")
        ) || [];


    employeeList.innerHTML = "";


    /* Alphabetical employee order */

    employees.sort(function(a, b) {

        return a.name.localeCompare(b.name);

    });


    if (employees.length === 0) {

        employeeList.innerHTML = `
            <div class="no-record">
                No registered employees yet.
            </div>
        `;

        return;
    }


    employees.forEach(function(employee) {

        /* Get this employee's monthly records */

        const employeeRecords =
            records.filter(function(record) {

                const recordDate =
                    parseAttendanceDate(record.date);

                if (!recordDate) return false;

                return (
                    record.employeeId.toLowerCase() ===
                    employee.id.toLowerCase() &&

                    recordDate.getMonth() ===
                    selectedMonth &&

                    recordDate.getFullYear() ===
                    selectedYear
                );

            });


        let presentCount = 0;
        let absentCount = 0;


        employeeRecords.forEach(function(record) {

            if (record.status === "Present") {
                presentCount++;
            }

            if (record.status === "Absent") {
                absentCount++;
            }

        });


        const folder =
            document.createElement("div");

        folder.className = "employee-folder";


        folder.innerHTML = `

            <div class="employee-header">

                <div class="employee-info">

                    <div class="folder-icon">
                        📁
                    </div>

                    <div>

                        <div class="employee-name">
                            ${employee.name}
                        </div>

                        <div class="employee-id">
                            Employee ID: ${employee.id}
                        </div>

                    </div>

                </div>

                <div class="arrow">
                    ▶
                </div>

            </div>


            <div class="employee-content">

                <div class="summary">

                    <div class="summary-box present-box">
                        Present: ${presentCount}
                    </div>

                    <div class="summary-box absent-box">
                        Absent: ${absentCount}
                    </div>

                </div>


                <div class="table-container">

                    <table>

                        <thead>

                            <tr>
                                <th>Employee ID</th>
                                <th>Employee Name</th>
                                <th>Date</th>
                                <th>Time In</th>
                                <th>Time Out</th>
                                <th>Status</th>
                            </tr>

                        </thead>

                        <tbody>

                            ${
                                employeeRecords.length > 0

                                ?

                                employeeRecords.map(function(record) {

                                    return `

                                        <tr>

                                            <td>
                                                ${record.employeeId}
                                            </td>

                                            <td>
                                                ${record.employeeName}
                                            </td>

                                            <td>
                                                ${record.date}
                                            </td>

                                            <td>
                                                ${record.timeIn || "-"}
                                            </td>

                                            <td>
                                                ${record.timeOut || "-"}
                                            </td>

                                            <td class="${
                                                record.status === "Present"
                                                ? "present"
                                                : "absent"
                                            }">
                                                ${record.status}
                                            </td>

                                        </tr>

                                    `;

                                }).join("")

                                :

                                `
                                    <tr>
                                        <td colspan="6" class="no-record">
                                            No attendance records for
                                            ${months[selectedMonth]}
                                            ${selectedYear}.
                                        </td>
                                    </tr>
                                `
                            }

                        </tbody>

                    </table>

                </div>

            </div>
        `;


        /* Make employee folder clickable */

        const header =
            folder.querySelector(".employee-header");

        header.addEventListener("click", function() {

            folder.classList.toggle("open");

        });


        employeeList.appendChild(folder);

    });

}


/*
   Convert dates saved by the Time In page.

   This supports dates such as:
   9/26/2026
   09/26/2026
   9/26/2026
*/

function parseAttendanceDate(dateString) {

    if (!dateString) {
        return null;
    }


    const parts =
        dateString.split("/");


    if (parts.length === 3) {

        const month =
            parseInt(parts[0]) - 1;

        const day =
            parseInt(parts[1]);

        const year =
            parseInt(parts[2]);


        return new Date(
            year,
            month,
            day
        );

    }


    const date =
        new Date(dateString);


    if (isNaN(date.getTime())) {
        return null;
    }


    return date;

}


monthSelect.addEventListener(
    "change",
    loadMonthlyAttendance
);


loadMonthlyAttendance();

</script>

</body>
</html>
