<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Registration</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f3f6fa;
}

header {
    background: #12355b;
    color: white;
    text-align: center;
    padding: 22px 15px;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 7px 0 0;
    font-size: 14px;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 15px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    margin-bottom: 25px;
}

h2 {
    color: #12355b;
    margin-top: 0;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
    color: #12355b;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #12355b;
}

.password-box {
    display: flex;
    gap: 8px;
}

.password-box input {
    flex: 1;
}

.eye-btn {
    width: 48px !important;
    margin-top: 0 !important;
    padding: 10px !important;
    background: #e9eef4 !important;
    color: #12355b !important;
    font-size: 18px !important;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #12355b;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #0d2946;
}

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #12355b;
    color: white;
    padding: 11px;
    text-align: left;
}

td {
    padding: 11px;
    border-bottom: 1px solid #ddd;
}

.action-btn {
    width: auto;
    margin: 2px;
    padding: 7px 10px;
    font-size: 12px;
}

.delete {
    background: #d62828;
}

.delete:hover {
    background: #b71f1f;
}

.back-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 11px 18px;
    background: #12355b;
    color: white;
    text-decoration: none;
    border-radius: 7px;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>Digital Attendance System</h1>
    <p>Employee Registration</p>
</header>

<div class="container">

<div class="card">

    <h2>Register Employee</h2>

    <label>Employee ID</label>
    <input
        type="text"
        id="employeeId"
        placeholder="Enter Employee ID">

    <label>Employee Name</label>
    <input
        type="text"
        id="employeeName"
        placeholder="Enter Employee Name">

    <label>Position</label>
    <input
        type="text"
        id="position"
        placeholder="Enter Position">

    <label>Department</label>
    <input
        type="text"
        id="department"
        placeholder="Enter Department">

    <label>Personal Password</label>

    <div class="password-box">
        <input
            type="password"
            id="password"
            placeholder="Create Password">

        <button
            type="button"
            class="eye-btn"
            onclick="togglePassword('password', this)">
            👁
        </button>
    </div>

    <button id="saveButton">
        SAVE EMPLOYEE
    </button>

</div>


<div class="card">

    <h2>Registered Employees</h2>

    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Position</th>
                    <th>Department</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="employeeTable"></tbody>

        </table>

    </div>

    <a href="dashboard.html" class="back-btn">
        ← BACK TO DASHBOARD
    </a>

</div>

</div>

<script>

let editIndex = -1;

const saveButton =
    document.getElementById("saveButton");


/* SHOW / HIDE PASSWORD */

function togglePassword(id, button) {

    const input =
        document.getElementById(id);

    if (input.type === "password") {

        input.type = "text";
        button.textContent = "🙈";

    } else {

        input.type = "password";
        button.textContent = "👁";

    }
}


/* SAVE EMPLOYEE */

saveButton.addEventListener("click", function() {

    const id =
        document.getElementById("employeeId")
        .value.trim();

    const name =
        document.getElementById("employeeName")
        .value.trim();

    const position =
        document.getElementById("position")
        .value.trim();

    const department =
        document.getElementById("department")
        .value.trim();

    const password =
        document.getElementById("password")
        .value.trim();


    if (!id || !name || !position ||
        !department || !password) {

        return;
    }


    let employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );


    if (editIndex === -1) {

        const duplicate =
            employees.some(function(emp) {

                return String(emp.id).toLowerCase()
                    === id.toLowerCase();

            });


        if (duplicate) {
            return;
        }


        employees.push({

            id: id,
            name: name,
            position: position,
            department: department,
            password: password

        });


        localStorage.setItem(
            "employees",
            JSON.stringify(employees)
        );


        window.location.href = "timein.html";

    } else {

        employees[editIndex] = {

            id: id,
            name: name,
            position: position,
            department: department,
            password: password

        };


        localStorage.setItem(
            "employees",
            JSON.stringify(employees)
        );


        editIndex = -1;

        saveButton.textContent =
            "SAVE EMPLOYEE";

        clearForm();

        displayEmployees();

    }

});


/* DISPLAY EMPLOYEES */

function displayEmployees() {

    const employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );

    const table =
        document.getElementById("employeeTable");

    table.innerHTML = "";


    employees.forEach(function(emp, index) {

        const row =
            document.createElement("tr");

        row.innerHTML = `

            <td>${emp.id}</td>

            <td>${emp.name}</td>

            <td>${emp.position}</td>

            <td>${emp.department}</td>

            <td>

                <button
                    class="action-btn"
                    onclick="editEmployee(${index})">
                    Edit
                </button>

                <button
                    class="action-btn delete"
                    onclick="deleteEmployee(${index})">
                    Delete
                </button>

            </td>

        `;

        table.appendChild(row);

    });

}


/* EDIT */

function editEmployee(index) {

    const employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );

    const emp =
        employees[index];


    document.getElementById("employeeId").value =
        emp.id;

    document.getElementById("employeeName").value =
        emp.name;

    document.getElementById("position").value =
        emp.position;

    document.getElementById("department").value =
        emp.department;

    document.getElementById("password").value =
        emp.password || "";


    editIndex = index;

    saveButton.textContent =
        "UPDATE EMPLOYEE";

}


/* DELETE */

function deleteEmployee(index) {

    if (!confirm("Delete this employee?")) {
        return;
    }


    const employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );


    employees.splice(index, 1);


    localStorage.setItem(
        "employees",
        JSON.stringify(employees)
    );


    displayEmployees();

}


/* CLEAR */

function clearForm() {

    document.getElementById("employeeId").value = "";

    document.getElementById("employeeName").value = "";

    document.getElementById("position").value = "";

    document.getElementById("department").value = "";

    document.getElementById("password").value = "";

}


displayEmployees();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time In</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f3f6fa;
}

header {
    background: #12355b;
    color: white;
    text-align: center;
    padding: 22px 15px;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 7px 0 0;
    font-size: 14px;
}

.container {
    max-width: 600px;
    margin: 35px auto;
    padding: 0 15px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

h2 {
    color: #12355b;
    margin-top: 0;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
    color: #12355b;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

input[readonly] {
    background: #f1f3f5;
}

.password-box {
    display: flex;
    gap: 8px;
}

.password-box input {
    flex: 1;
}

.eye-btn {
    width: 50px !important;
    margin-top: 0 !important;
    padding: 10px !important;
    background: #e9eef4 !important;
    color: #12355b !important;
    font-size: 18px !important;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #16803c;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #126b32;
}

#result {
    display: none;
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
}

.back-btn {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #12355b;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>Digital Attendance System</h1>
    <p>Faculty and Staff Time In</p>
</header>

<div class="container">

<div class="card">

    <h2>Employee Time In</h2>

    <label>Employee ID</label>

    <input
        type="text"
        id="employeeId"
        placeholder="Enter Employee ID"
        autocomplete="off">

    <label>Password</label>

    <div class="password-box">

        <input
            type="password"
            id="password"
            placeholder="Enter Personal Password">

        <button
            type="button"
            class="eye-btn"
            onclick="togglePassword('password', this)">
            👁
        </button>

    </div>

    <label>Employee Name</label>

    <input
        type="text"
        id="employeeName"
        placeholder="Employee name"
        readonly>

    <button type="button" id="timeInButton">
        TIME IN
    </button>

    <div id="result"></div>

    <a href="dashboard.html" class="back-btn">
        ← BACK TO DASHBOARD
    </a>

</div>

</div>

<script>

const idInput =
    document.getElementById("employeeId");

const passwordInput =
    document.getElementById("password");

const nameInput =
    document.getElementById("employeeName");

const button =
    document.getElementById("timeInButton");

const result =
    document.getElementById("result");


/* VIEW / HIDE PASSWORD */

function togglePassword(id, button) {

    const input =
        document.getElementById(id);

    if (input.type === "password") {

        input.type = "text";
        button.textContent = "🙈";

    } else {

        input.type = "password";
        button.textContent = "👁";

    }
}


/* TODAY */

function getToday() {

    const now = new Date();

    return now.getFullYear() +
        "-" +
        String(now.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(now.getDate()).padStart(2, "0");
}


/* VERIFY EMPLOYEE */

function verifyEmployee() {

    const id =
        idInput.value.trim();

    const password =
        passwordInput.value;

    nameInput.value = "";

    if (!id || !password) {
        return null;
    }


    const employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );


    const employee =
        employees.find(function(emp) {

            return (
                String(emp.id).toLowerCase()
                === id.toLowerCase()
                &&
                String(emp.password)
                === password
            );

        });


    if (employee) {

        nameInput.value =
            employee.name;

        return employee;

    }


    return null;
}


/* MESSAGE */

function showMessage(message, success) {

    result.style.display = "block";

    result.textContent = message;

    if (success) {

        result.style.background = "#e8f7ed";
        result.style.color = "#16803c";

    } else {

        result.style.background = "#fdeaea";
        result.style.color = "#d62828";

    }
}


/* TIME IN */

function timeIn() {

    const employee =
        verifyEmployee();


    if (!employee) {

        showMessage(
            "Invalid Employee ID or Password.",
            false
        );

        return;
    }


    const today =
        getToday();


    let records =
        JSON.parse(
            localStorage.getItem("attendanceRecords") || "[]"
        );


    const alreadyRecorded =
        records.some(function(record) {

            return (
                String(record.employeeId).toLowerCase()
                === String(employee.id).toLowerCase()
                &&
                record.attendanceDate === today
            );

        });


    if (alreadyRecorded) {

        showMessage(
            employee.name +
            " already has an attendance record today.",
            false
        );

        return;
    }


    const now = new Date();


    records.push({

        employeeId: employee.id,

        employeeName: employee.name,

        attendanceDate: today,

        date: now.toLocaleDateString(),

        timeIn: now.toLocaleTimeString(),

        timeOut: "",

        status: "Present"

    });


    localStorage.setItem(
        "attendanceRecords",
        JSON.stringify(records)
    );


    showMessage(
        employee.name +
        " successfully timed in at " +
        now.toLocaleTimeString(),
        true
    );


    idInput.value = "";

    passwordInput.value = "";

    nameInput.value = "";

}

button.addEventListener(
    "click",
    timeIn
);

</script>

</body>
</html>
