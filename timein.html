<!DOCTYPE html>
<html>
<head>
    <title>Employee Time In</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0 0 8px;
        }

        .container {
            max-width: 700px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            color: #1e3a8a;
            margin-top: 0;
        }

        .label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        #employeeName {
            background: #f3f4f6;
        }

        .time-button {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .time-button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #eff6ff;
            text-align: center;
            font-weight: bold;
        }

        .back-button {
            display: block;
            text-align: center;
            margin-top: 20px;
            padding: 13px;
            background: #374151;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            .container {
                margin-top: 20px;
            }

            .card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Digital Attendance System</h1>
    <p>Faculty and Staff Time In</p>
</div>


<div class="container">

    <div class="card">

        <h2>Employee Time In</h2>

        <label class="label">
            Employee ID
        </label>

        <input
            type="text"
            id="employeeId"
            placeholder="Enter Employee ID"
            oninput="findEmployee()">


        <label class="label">
            Employee Name
        </label>

        <input
            type="text"
            id="employeeName"
            placeholder="Employee Name"
            readonly>


        <button
            class="time-button"
            onclick="timeIn()">

            TIME IN

        </button>


        <div
            class="result"
            id="result"
            style="display:none;">
        </div>


        <a
            href="dashboard.html"
            class="back-button">

            BACK TO DASHBOARD

        </a>

    </div>

</div>


<script>


/* AUTOMATICALLY FIND EMPLOYEE */

function findEmployee() {

    let id =
        document.getElementById("employeeId").value.trim();


    let name =
        document.getElementById("employeeName");


    let employees =
        JSON.parse(localStorage.getItem("employees")) || [];


    let employee =
        employees.find(function(item) {

            return item.id.toLowerCase() ===
                   id.toLowerCase();

        });


    if (employee) {

        name.value = employee.name;

    } else {

        name.value = "";

    }

}


/* TIME IN */

function timeIn() {

    let id =
        document.getElementById("employeeId").value.trim();


    let name =
        document.getElementById("employeeName").value.trim();


    if (id === "" || name === "") {

        return;

    }


    let records =
        JSON.parse(
            localStorage.getItem("attendanceRecords")
        ) || [];


    let alreadyTimedIn =
        records.find(function(record) {

            return record.employeeId === id &&
                   record.timeOut === "";

        });


    if (alreadyTimedIn) {

        return;

    }


    let now = new Date();


    let record = {

        employeeId: id,

        employeeName: name,

        date: now.toLocaleDateString(),

        timeIn: now.toLocaleTimeString(),

        timeOut: "",

        status: "Present"

    };


    records.push(record);


    localStorage.setItem(
        "attendanceRecords",
        JSON.stringify(records)
    );


    document.getElementById("result").style.display =
        "block";


    document.getElementById("result").innerHTML =
        "TIME IN: " + record.timeIn;


    document.getElementById("employeeId").value = "";

    document.getElementById("employeeName").value = "";

}


</script>

</body>
</html>
