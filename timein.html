<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time In</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f3f6fa;
}

header {
    background: #12355b;
    color: white;
    text-align: center;
    padding: 22px 15px;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 7px 0 0;
    font-size: 14px;
}

.container {
    max-width: 600px;
    margin: 35px auto;
    padding: 0 15px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

h2 {
    color: #12355b;
    margin-top: 0;
    text-align: center;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
    color: #12355b;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #12355b;
}

input[readonly] {
    background: #f1f3f5;
}

.password-box {
    display: flex;
    gap: 8px;
}

.password-box input {
    flex: 1;
}

.eye-btn {
    width: 50px !important;
    margin-top: 0 !important;
    padding: 10px !important;
    background: #e9eef4 !important;
    color: #12355b !important;
    font-size: 18px !important;
    cursor: pointer;
}

.timein-btn {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #16803c;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.timein-btn:hover {
    background: #126b32;
}

#result {
    display: none;
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
}

.back-btn {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #12355b;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>Digital Attendance System</h1>
    <p>Faculty and Staff Time In</p>
</header>

<div class="container">

<div class="card">

    <h2>Employee Time In</h2>

    <label>Employee ID</label>

    <input
        type="text"
        id="employeeId"
        placeholder="Enter Employee ID"
        autocomplete="off"
    >

    <label>Employee Name</label>

    <input
        type="text"
        id="employeeName"
        placeholder="Employee name will appear here"
        readonly
    >

    <label>Password</label>

    <div class="password-box">

        <input
            type="password"
            id="password"
            placeholder="Enter Personal Password"
            autocomplete="off"
        >

        <button
            type="button"
            class="eye-btn"
            onclick="togglePassword()"
        >
            👁
        </button>

    </div>

    <button
        type="button"
        class="timein-btn"
        onclick="timeIn()"
    >
        TIME IN
    </button>

    <div id="result"></div>

    <a href="dashboard.html" class="back-btn">
        ← BACK TO DASHBOARD
    </a>

</div>

</div>

<script>

const employeeId =
    document.getElementById("employeeId");

const employeeName =
    document.getElementById("employeeName");

const password =
    document.getElementById("password");

const result =
    document.getElementById("result");


/* AUTOMATICALLY SHOW EMPLOYEE NAME */

employeeId.addEventListener("input", function() {

    const id = employeeId.value.trim();

    employeeName.value = "";

    if (id === "") {
        return;
    }

    const employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );

    const employee =
        employees.find(function(emp) {

            return String(emp.id).trim().toLowerCase()
                === id.toLowerCase();

        });

    if (employee) {

        employeeName.value = employee.name;

    } else {

        employeeName.value = "Employee not found";

    }

});


/* SHOW / HIDE PASSWORD */

function togglePassword() {

    const eye =
        document.querySelector(".eye-btn");

    if (password.type === "password") {

        password.type = "text";
        eye.textContent = "🙈";

    } else {

        password.type = "password";
        eye.textContent = "👁";

    }

}


/* GET TODAY */

function getToday() {

    const now = new Date();

    return (
        now.getFullYear() +
        "-" +
        String(now.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(now.getDate()).padStart(2, "0")
    );

}


/* FIND EMPLOYEE USING ID */

function findEmployee() {

    const id =
        employeeId.value.trim();

    const employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );

    return employees.find(function(emp) {

        return String(emp.id).trim().toLowerCase()
            === id.toLowerCase();

    });

}


/* MESSAGE */

function showMessage(message, success) {

    result.style.display = "block";

    result.textContent = message;

    if (success) {

        result.style.background = "#e8f7ed";
        result.style.color = "#16803c";

    } else {

        result.style.background = "#fdeaea";
        result.style.color = "#d62828";

    }

}


/* TIME IN */

function timeIn() {

    const employee = findEmployee();

    const pass = password.value;


    if (!employee) {

        showMessage(
            "Employee ID not found.",
            false
        );

        return;
    }


    if (pass === "") {

        showMessage(
            "Please enter your password.",
            false
        );

        return;
    }


    if (String(employee.password) !== pass) {

        showMessage(
            "Incorrect password.",
            false
        );

        return;
    }


    const today = getToday();


    let records =
        JSON.parse(
            localStorage.getItem("attendanceRecords") || "[]"
        );


    const alreadyRecorded =
        records.some(function(record) {

            return (
                String(record.employeeId).trim().toLowerCase()
                === String(employee.id).trim().toLowerCase()
                &&
                record.attendanceDate === today
            );

        });


    if (alreadyRecorded) {

        showMessage(
            employee.name +
            " already has a Time In record today.",
            false
        );

        return;
    }


    const now = new Date();


    records.push({

        employeeId: employee.id,

        employeeName: employee.name,

        attendanceDate: today,

        date: now.toLocaleDateString(),

        timeIn: now.toLocaleTimeString(),

        timeOut: "",

        status: "Present"

    });


    localStorage.setItem(
        "attendanceRecords",
        JSON.stringify(records)
    );


    showMessage(
        employee.name +
        " successfully timed in at " +
        now.toLocaleTimeString(),
        true
    );


    employeeId.value = "";
    password.value = "";
    employeeName.value = "";

}

</script>

</body>
</html>
