<!DOCTYPE html>
<html>
<head>
    <title>Time In</title>
</head>

<body>

<h1>Employee Time In</h1>

<p>Employee ID</p>
<input type="text" id="employeeId">

<p>Employee Name</p>
<input type="text" id="employeeName">

<br><br>

<button onclick="timeIn()">TIME IN</button>

<p id="result"></p>

<br>

<a href="dashboard.html">BACK TO DASHBOARD</a>

<script>

function timeIn() {

    let id = document.getElementById("employeeId").value;
    let name = document.getElementById("employeeName").value;

    if (id === "" || name === "") {
        alert("Please enter Employee ID and Employee Name.");
        return;
    }

    let records = JSON.parse(localStorage.getItem("attendanceRecords")) || [];

    let alreadyTimedIn = records.find(function(record) {
        return record.employeeId === id && record.timeOut === "";
    });

    if (alreadyTimedIn) {
        alert("This employee is already timed in.");
        return;
    }

    let now = new Date();

    let record = {
        employeeId: id,
        employeeName: name,
        date: now.toLocaleDateString(),
        timeIn: now.toLocaleTimeString(),
        timeOut: "",
        status: "Present"
    };

    records.push(record);

    localStorage.setItem("attendanceRecords", JSON.stringify(records));

    document.getElementById("result").innerHTML =
        "TIME IN SUCCESSFUL!<br>" +
        name + "<br>" +
        record.timeIn;

    document.getElementById("employeeId").value = "";
    document.getElementById("employeeName").value = "";
}

</script>

</body>
</html>
