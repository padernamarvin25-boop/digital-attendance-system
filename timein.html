<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time In</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f3f6fa;
}

header {
    background: #12355b;
    color: white;
    text-align: center;
    padding: 22px 15px;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 7px 0 0;
    font-size: 14px;
}

.container {
    max-width: 600px;
    margin: 35px auto;
    padding: 0 15px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

.card h2 {
    color: #12355b;
    margin-top: 0;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
    color: #12355b;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #12355b;
}

input[readonly] {
    background: #f1f3f5;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #16803c;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    display: block;
    position: relative;
    z-index: 10;
}

button:hover {
    background: #126b32;
}

button:active {
    transform: scale(0.99);
}

#result {
    display: none;
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
}

.back-btn {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #12355b;
    text-decoration: none;
    font-weight: bold;
}

.back-btn:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<header>
    <h1>Digital Attendance System</h1>
    <p>Faculty and Staff Time In</p>
</header>

<div class="container">

    <div class="card">

        <h2>Employee Time In</h2>

        <label for="employeeId">Employee ID</label>

        <input
            type="text"
            id="employeeId"
            placeholder="Enter Employee ID"
            autocomplete="off"
        >

        <label for="employeeName">Employee Name</label>

        <input
            type="text"
            id="employeeName"
            placeholder="Employee name"
            readonly
        >

        <button type="button" id="timeInButton">
            TIME IN
        </button>

        <div id="result"></div>

        <a href="dashboard.html" class="back-btn">
            ← BACK TO DASHBOARD
        </a>

    </div>

</div>

<script>

const employeeIdInput =
    document.getElementById("employeeId");

const employeeNameInput =
    document.getElementById("employeeName");

const timeInButton =
    document.getElementById("timeInButton");

const result =
    document.getElementById("result");


/* GET TODAY'S DATE */

function getToday() {

    const now = new Date();

    const year = now.getFullYear();

    const month =
        String(now.getMonth() + 1)
        .padStart(2, "0");

    const day =
        String(now.getDate())
        .padStart(2, "0");

    return year + "-" + month + "-" + day;
}


/* FIND EMPLOYEE */

function findEmployee() {

    const id =
        employeeIdInput.value.trim();

    employeeNameInput.value = "";

    if (id === "") {
        return;
    }

    const employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );

    const employee =
        employees.find(function(emp) {

            return String(emp.id).toLowerCase() ===
                   id.toLowerCase();

        });

    if (employee) {

        employeeNameInput.value = employee.name;

    }
}


/* SHOW MESSAGE */

function showMessage(message, success) {

    result.style.display = "block";

    result.textContent = message;

    if (success) {

        result.style.background = "#e8f7ed";
        result.style.color = "#16803c";

    } else {

        result.style.background = "#fdeaea";
        result.style.color = "#d62828";

    }
}


/* TIME IN */

function timeIn() {

    const id =
        employeeIdInput.value.trim();

    const name =
        employeeNameInput.value.trim();


    /* CHECK EMPLOYEE */

    if (id === "" || name === "") {

        showMessage(
            "Please enter a valid Employee ID.",
            false
        );

        return;
    }


    const today = getToday();


    let records =
        JSON.parse(
            localStorage.getItem("attendanceRecords") || "[]"
        );


    /* PREVENT DUPLICATE ATTENDANCE TODAY */

    const alreadyRecorded =
        records.some(function(record) {

            const recordId =
                String(record.employeeId || "")
                .toLowerCase();

            return (
                recordId === id.toLowerCase() &&
                record.attendanceDate === today
            );

        });


    if (alreadyRecorded) {

        showMessage(
            name + " already has an attendance record today.",
            false
        );

        return;
    }


    /* CURRENT TIME */

    const now = new Date();


    const newRecord = {

        employeeId: id,

        employeeName: name,

        attendanceDate: today,

        date: now.toLocaleDateString(),

        timeIn: now.toLocaleTimeString(),

        timeOut: "",

        status: "Present"

    };


    records.push(newRecord);


    localStorage.setItem(
        "attendanceRecords",
        JSON.stringify(records)
    );


    showMessage(
        name +
        " successfully timed in at " +
        now.toLocaleTimeString(),
        true
    );


    /* CLEAR FORM */

    employeeIdInput.value = "";

    employeeNameInput.value = "";

}


/* FIND NAME WHILE TYPING */

employeeIdInput.addEventListener(
    "input",
    findEmployee
);


/* BUTTON CLICK */

timeInButton.addEventListener(
    "click",
    timeIn
);

</script>

</body>
</html>
