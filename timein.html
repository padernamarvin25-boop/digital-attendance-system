<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Time In</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f3f6fa;
}

header {
    background: #12355b;
    color: white;
    text-align: center;
    padding: 22px 15px;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 7px 0 0;
    font-size: 14px;
}

.container {
    max-width: 600px;
    margin: 35px auto;
    padding: 0 15px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

h2 {
    color: #12355b;
    margin-top: 0;
    text-align: center;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
    color: #12355b;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #12355b;
}

input[readonly] {
    background: #f1f3f5;
}

/* PASSWORD */

.password-box {
    display: flex;
    gap: 8px;
}

.password-box input {
    flex: 1;
}

.eye-btn {
    width: 50px !important;
    margin-top: 0 !important;
    padding: 10px !important;
    background: #e9eef4 !important;
    color: #12355b !important;
    font-size: 18px !important;
    cursor: pointer;
}

/* TIME IN BUTTON */

.timein-btn {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #16803c;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.timein-btn:hover {
    background: #126b32;
}

/* MESSAGE */

#result {
    display: none;
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
}

/* BACK */

.back-btn {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #12355b;
    text-decoration: none;
    font-weight: bold;
}

</style>

</head>

<body>


<header>

    <h1>Digital Attendance System</h1>

    <p>Faculty and Staff Time In</p>

</header>


<div class="container">

<div class="card">

    <h2>Employee Time In</h2>


    <!-- EMPLOYEE ID -->

    <label>Employee ID</label>

    <input
        type="text"
        id="employeeId"
        placeholder="Enter Employee ID"
        autocomplete="off"
    >


    <!-- PASSWORD -->

    <label>Password</label>

    <div class="password-box">

        <input
            type="password"
            id="password"
            placeholder="Enter Personal Password"
            autocomplete="off"
        >

        <button
            type="button"
            class="eye-btn"
            onclick="togglePassword()"
        >
            👁
        </button>

    </div>


    <!-- EMPLOYEE NAME -->

    <label>Employee Name</label>

    <input
        type="text"
        id="employeeName"
        placeholder="Employee name will appear here"
        readonly
    >


    <!-- TIME IN -->

    <button
        type="button"
        class="timein-btn"
        onclick="timeIn()"
    >
        TIME IN
    </button>


    <!-- RESULT -->

    <div id="result"></div>


    <!-- BACK -->

    <a
        href="dashboard.html"
        class="back-btn"
    >
        ← BACK TO DASHBOARD
    </a>

</div>

</div>


<script>

/* ELEMENTS */

const employeeId =
    document.getElementById("employeeId");

const password =
    document.getElementById("password");

const employeeName =
    document.getElementById("employeeName");

const result =
    document.getElementById("result");


/* SHOW / HIDE PASSWORD */

function togglePassword() {

    const eye =
        document.querySelector(".eye-btn");


    if (password.type === "password") {

        password.type = "text";

        eye.textContent = "🙈";

    } else {

        password.type = "password";

        eye.textContent = "👁";

    }

}


/* GET TODAY */

function getToday() {

    const now = new Date();

    return (
        now.getFullYear() +
        "-" +
        String(now.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(now.getDate()).padStart(2, "0")
    );

}


/* FIND EMPLOYEE */

function verifyEmployee() {

    const id =
        employeeId.value.trim();

    const pass =
        password.value;


    employeeName.value = "";


    if (id === "" || pass === "") {

        return null;

    }


    const employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );


    const employee =
        employees.find(function(emp) {

            return (
                String(emp.id).toLowerCase()
                === id.toLowerCase()
                &&
                String(emp.password)
                === pass
            );

        });


    if (employee) {

        employeeName.value =
            employee.name;

        return employee;

    }


    return null;

}


/* SHOW MESSAGE */

function showMessage(message, success) {

    result.style.display = "block";

    result.textContent = message;


    if (success) {

        result.style.background = "#e8f7ed";

        result.style.color = "#16803c";

    } else {

        result.style.background = "#fdeaea";

        result.style.color = "#d62828";

    }

}


/* TIME IN */

function timeIn() {

    const employee =
        verifyEmployee();


    /* INVALID ID / PASSWORD */

    if (!employee) {

        showMessage(
            "Invalid Employee ID or Password.",
            false
        );

        return;

    }


    const today =
        getToday();


    /* GET ATTENDANCE RECORDS */

    let records =
        JSON.parse(
            localStorage.getItem("attendanceRecords") || "[]"
        );


    /* CHECK IF ALREADY TIMED IN TODAY */

    const alreadyRecorded =
        records.some(function(record) {

            return (
                String(record.employeeId).toLowerCase()
                === String(employee.id).toLowerCase()
                &&
                record.attendanceDate === today
            );

        });


    if (alreadyRecorded) {

        showMessage(
            employee.name +
            " already has a Time In record today.",
            false
        );

        return;

    }


    /* CURRENT TIME */

    const now =
        new Date();


    /* CREATE RECORD */

    records.push({

        employeeId: employee.id,

        employeeName: employee.name,

        attendanceDate: today,

        date: now.toLocaleDateString(),

        timeIn: now.toLocaleTimeString(),

        timeOut: "",

        status: "Present"

    });


    /* SAVE RECORD */

    localStorage.setItem(
        "attendanceRecords",
        JSON.stringify(records)
    );


    /* SUCCESS */

    showMessage(
        employee.name +
        " successfully timed in at " +
        now.toLocaleTimeString(),
        true
    );


    /* CLEAR INPUTS */

    employeeId.value = "";

    password.value = "";

    employeeName.value = "";

}

</script>

</body>
</html>
