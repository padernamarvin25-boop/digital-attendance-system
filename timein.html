<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Time In</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 400px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.4);
        }

        input[type="submit"] {
            width: 100%;
            padding: 13px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        input[type="submit"]:hover {
            background: #5568d9;
        }

        #result {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            color: #28a745;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Employee Time In</h1>

        <p class="subtitle">
            Enter your employee information
        </p>

        <form onsubmit="return saveTimeIn()">

            <label for="employeeId">Employee ID</label>
            <input
                type="text"
                id="employeeId"
                placeholder="Enter Employee ID"
                required
            >

            <label for="employeeName">Employee Name</label>
            <input
                type="text"
                id="employeeName"
                placeholder="Enter Employee Name"
                required
            >

            <input type="submit" value="TIME IN">

        </form>

        <p id="result"></p>

        <a href="dashboard.html" class="back">
            ← Back to Dashboard
        </a>

    </div>

    <script>

        function saveTimeIn() {

            var id = document.getElementById("employeeId").value;
            var name = document.getElementById("employeeName").value;

            var now = new Date();

            var attendance = {
                employeeId: id,
                employeeName: name,
                timeIn: now.toLocaleString()
            };

            // Kunin ang existing attendance records
            var records =
                JSON.parse(localStorage.getItem("attendance")) || [];

            // Idagdag ang bagong time-in
            records.push(attendance);

            // I-save sa localStorage
            localStorage.setItem(
                "attendance",
                JSON.stringify(records)
            );

            // Message
            document.getElementById("result").innerHTML =
                "✓ Time In successful!<br>" +
                name + " - " +
                now.toLocaleTimeString();

            // Clear fields
            document.getElementById("employeeId").value = "";
            document.getElementById("employeeName").value = "";

            return false;
        }

    </script>

</body>
</html>
