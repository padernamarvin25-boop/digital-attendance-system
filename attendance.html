<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Attendance</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f3f6fa;
}

header {
    background: #12355b;
    color: white;
    text-align: center;
    padding: 22px 15px;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 7px 0 0;
    font-size: 14px;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 15px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

.card h2 {
    color: #12355b;
    margin-top: 0;
}

/* SMALL SUMMARY BOXES */

.summary {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
}

.summary-box {
    width: 160px;
    padding: 14px;
    border-radius: 10px;
    background: #eef4f9;
    text-align: center;
}

.summary-box h3 {
    margin: 0 0 6px;
    font-size: 13px;
    color: #12355b;
}

.summary-box p {
    margin: 0;
    font-size: 22px;
    font-weight: bold;
    color: #12355b;
}

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th {
    background: #12355b;
    color: white;
    padding: 12px;
    text-align: left;
}

td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
}

tr:hover {
    background: #f7f9fb;
}

.status {
    font-weight: bold;
}

.present {
    color: #16803c;
}

.absent {
    color: #d62828;
}

.no-record {
    text-align: center;
    padding: 25px;
    color: #777;
}

.back-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 11px 18px;
    background: #12355b;
    color: white;
    text-decoration: none;
    border-radius: 7px;
    font-weight: bold;
}

.back-btn:hover {
    background: #0d2946;
}

.date-today {
    color: #666;
    font-size: 14px;
    margin-bottom: 15px;
}
</style>
</head>

<body>

<header>
    <h1>Digital Attendance System</h1>
    <p>Daily Attendance Record</p>
</header>

<div class="container">

    <div class="card">

        <h2>Today's Attendance</h2>

        <div class="date-today" id="todayDate"></div>

        <!-- SUMMARY -->

        <div class="summary">

            <div class="summary-box">
                <h3>TOTAL PRESENT</h3>
                <p id="totalPresent">0</p>
            </div>

            <div class="summary-box">
                <h3>TOTAL ABSENT</h3>
                <p id="totalAbsent">0</p>
            </div>

        </div>


        <!-- TABLE -->

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Employee ID</th>
                        <th>Employee Name</th>
                        <th>Date</th>
                        <th>Time In</th>
                        <th>Time Out</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="attendanceTable">
                </tbody>

            </table>

        </div>


        <a href="dashboard.html" class="back-btn">
            ← BACK TO DASHBOARD
        </a>

    </div>

</div>


<script>

/* GET TODAY'S DATE */

function getToday() {

    const now = new Date();

    const year = now.getFullYear();

    const month =
        String(now.getMonth() + 1)
        .padStart(2, "0");

    const day =
        String(now.getDate())
        .padStart(2, "0");

    return ${year}-${month}-${day};
}


/* DISPLAY TODAY'S DATE */

function displayTodayDate() {

    const today = new Date();

    document.getElementById("todayDate").textContent =
        today.toLocaleDateString(
            undefined,
            {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            }
        );
}


/* LOAD ATTENDANCE */

function loadAttendance() {

    const records =
        JSON.parse(
            localStorage.getItem("attendanceRecords")
        ) || [];


    const today = getToday();


    /*
       SHOW TODAY ONLY
    */

    const todayRecords =
        records.filter(function(record) {

            /*
               New records use attendanceDate.
            */

            if (record.attendanceDate) {

                return record.attendanceDate === today;

            }


            /*
               Compatibility with older records
               that don't have attendanceDate.
            */

            if (record.date) {

                const parts =
                    record.date.split("/");

                if (parts.length === 3) {

                    const month =
                        String(
                            parseInt(parts[0])
                        ).padStart(2, "0");

                    const day =
                        String(
                            parseInt(parts[1])
                        ).padStart(2, "0");

                    const year =
                        parts[2];

                    const oldDate =
                        ${year}-${month}-${day};

                    return oldDate === today;
                }

            }

            return false;

        });


    /*
       SORT ALPHABETICALLY BY NAME
    */

    todayRecords.sort(function(a, b) {

        return a.employeeName.localeCompare(
            b.employeeName
        );

    });


    const table =
        document.getElementById(
            "attendanceTable"
        );


    table.innerHTML = "";


    let present = 0;

    let absent = 0;


    if (todayRecords.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="6" class="no-record">
                    No attendance records for today.
                </td>
            </tr>
        `;

    }


    todayRecords.forEach(function(record) {

        if (record.status === "Present") {

            present++;

        }

        if (record.status === "Absent") {

            absent++;

        }


        const row =
            document.createElement("tr");


        let statusClass = "";

        if (record.status === "Present") {

            statusClass = "present";

        } else if (record.status === "Absent") {

            statusClass = "absent";

        }


        row.innerHTML = `

            <td>${record.employeeId}</td>

            <td>${record.employeeName}</td>

            <td>${record.date || ""}</td>

            <td>${record.timeIn || ""}</td>

            <td>${record.timeOut || ""}</td>

            <td class="status ${statusClass}">
                ${record.status || ""}
            </td>

        `;


        table.appendChild(row);

    });


    document.getElementById(
        "totalPresent"
    ).textContent = present;


    document.getElementById(
        "totalAbsent"
    ).textContent = absent;

}


/* START */

displayTodayDate();

loadAttendance();


/*
   Automatically refresh the page data
   when returning to this page.
*/

window.addEventListener(
    "storage",
    loadAttendance
);

</script>

</body>
</html>
