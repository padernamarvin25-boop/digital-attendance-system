<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Record</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    color: #222;
}

header {
    background: #0b1f3a;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

.container {
    width: 95%;
    max-width: 1100px;
    margin: 30px auto;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h2 {
    color: #0b1f3a;
    margin-top: 0;
}

/* DEPARTMENT FOLDERS */

.folder-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    margin-top: 25px;
}

.folder {
    background: #eef3f8;
    border: 2px solid #d6e0ea;
    border-radius: 12px;
    padding: 30px 15px;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
}

.folder:hover {
    transform: translateY(-3px);
    background: #e3ebf4;
}

.folder-icon {
    font-size: 45px;
    margin-bottom: 10px;
}

.folder-name {
    font-size: 18px;
    font-weight: bold;
    color: #0b1f3a;
}

/* TABLE */

#tableView {
    display: none;
}

.back-btn {
    background: #0b1f3a;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 7px;
    cursor: pointer;
    margin-bottom: 20px;
}

.back-btn:hover {
    background: #163b6d;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

th {
    background: #0b1f3a;
    color: white;
    padding: 13px;
    text-align: left;
}

td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
}

tr:hover {
    background: #f5f7fa;
}

.present {
    color: green;
    font-weight: bold;
}

.absent {
    color: red;
    font-weight: bold;
}

.no-record {
    text-align: center;
    padding: 25px;
    color: #777;
}

.dashboard-btn {
    margin-top: 20px;
}

@media(max-width: 600px) {
    th, td {
        font-size: 13px;
        padding: 9px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Attendance Record</h1>
</header>


<div class="container">

    <!-- =========================
         DEPARTMENT FOLDERS
    ========================== -->

    <div class="card" id="departmentView">

        <h2>Select Department</h2>

        <div class="folder-container">

            <div class="folder"
                 onclick="openDepartment('BSCRIM')">
                <div class="folder-icon">📁</div>
                <div class="folder-name">BSCRIM</div>
            </div>

            <div class="folder"
                 onclick="openDepartment('BSIT')">
                <div class="folder-icon">📁</div>
                <div class="folder-name">BSIT</div>
            </div>

            <div class="folder"
                 onclick="openDepartment('BSHM')">
                <div class="folder-icon">📁</div>
                <div class="folder-name">BSHM</div>
            </div>

            <div class="folder"
                 onclick="openDepartment('BSED')">
                <div class="folder-icon">📁</div>
                <div class="folder-name">BSED</div>
            </div>

            <div class="folder"
                 onclick="openDepartment('BSBA')">
                <div class="folder-icon">📁</div>
                <div class="folder-name">BSBA</div>
            </div>

            <div class="folder"
                 onclick="openDepartment('BEED')">
                <div class="folder-icon">📁</div>
                <div class="folder-name">BEED</div>
            </div>

        </div>


        <button class="back-btn dashboard-btn"
                onclick="goDashboard()">

            ← Back to Dashboard

        </button>

    </div>


    <!-- =========================
         ATTENDANCE TABLE
    ========================== -->

    <div class="card" id="tableView">

        <button class="back-btn"
                onclick="backToDepartments()">

            ← Back to Departments

        </button>


        <h2 id="departmentTitle">
            Department Attendance
        </h2>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>Employee ID</th>
                        <th>Employee Name</th>
                        <th>Date</th>
                        <th>Time In</th>
                        <th>Time Out</th>
                        <th>Status</th>
                    </tr>

                </thead>


                <tbody id="attendanceTable">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

/* =================================
   OPEN DEPARTMENT
================================= */

function openDepartment(department) {

    document.getElementById("departmentView")
        .style.display = "none";

    document.getElementById("tableView")
        .style.display = "block";


    document.getElementById("departmentTitle")
        .textContent =
        department + " Attendance Record";


    loadDepartmentRecords(department);
}


/* =================================
   LOAD ATTENDANCE RECORDS
================================= */

function loadDepartmentRecords(department) {

    const employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );


    const records =
        JSON.parse(
            localStorage.getItem("attendanceRecords") || "[]"
        );


    const table =
        document.getElementById("attendanceTable");


    table.innerHTML = "";


    /*
       Find records by Employee ID.

       The employee's department comes
       from the employees list.
    */

    const departmentRecords = records.filter(record => {

        const employee =
            employees.find(emp =>
                String(emp.id).trim() ===
                String(record.employeeId).trim()
            );


        return employee &&
               String(employee.department).trim()
               .toUpperCase() ===
               String(department).trim().toUpperCase();

    });


    /*
       Sort records by employee name.
    */

    departmentRecords.sort((a, b) => {

        const employeeA =
            employees.find(emp =>
                String(emp.id).trim() ===
                String(a.employeeId).trim()
            );

        const employeeB =
            employees.find(emp =>
                String(emp.id).trim() ===
                String(b.employeeId).trim()
            );


        return String(employeeA?.name || a.employeeName || "")
            .localeCompare(
                String(employeeB?.name || b.employeeName || "")
            );

    });


    /*
       If there are no records.
    */

    if (departmentRecords.length === 0) {

        table.innerHTML = `

            <tr>

                <td colspan="6"
                    class="no-record">

                    No attendance records found
                    for ${department}.

                </td>

            </tr>

        `;

        return;
    }


    /*
       Display every attendance record.
    */

    departmentRecords.forEach(record => {

        /*
           Find the registered employee
           using Employee ID.
        */

        const employee =
            employees.find(emp =>
                String(emp.id).trim() ===
                String(record.employeeId).trim()
            );


        /*
           IMPORTANT:
           Get the name from the employee
           registration first.
        */

        const employeeName =
            employee
            ? employee.name
            : record.employeeName;


        const row =
            document.createElement("tr");


        const status =
            record.status || "Present";


        const statusClass =
            status.toLowerCase() === "present"
            ? "present"
            : "absent";


        row.innerHTML = `

            <td>
                ${record.employeeId || "-"}
            </td>

            <td>
                ${employeeName || "-"}
            </td>

            <td>
                ${record.date ||
                 record.attendanceDate ||
                 "-"}
            </td>

            <td>
                ${record.timeIn || "-"}
            </td>

            <td>
                ${record.timeOut || "-"}
            </td>

            <td class="${statusClass}">
                ${status}
            </td>

        `;


        table.appendChild(row);

    });

}


/* =================================
   BACK TO DEPARTMENTS
================================= */

function backToDepartments() {

    document.getElementById("tableView")
        .style.display = "none";

    document.getElementById("departmentView")
        .style.display = "block";

}


/* =================================
   BACK TO DASHBOARD
================================= */

function goDashboard() {

    window.location.href =
        "dashboard.html";

}


/* =================================
   AUTO REFRESH WHEN PAGE RETURNS
================================= */

window.addEventListener("focus", function() {

    const title =
        document.getElementById("departmentTitle")
            .textContent;

    if (
        title &&
        title !== "Department Attendance"
    ) {

        const department =
            title.replace(
                " Attendance Record",
                ""
            );

        loadDepartmentRecords(department);

    }

});

</script>

</body>
</html>
