<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Attendance Record</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f3f6fa;
}

/* HEADER */

header {
    background: #12355b;
    color: white;
    text-align: center;
    padding: 22px 15px;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 7px 0 0;
    font-size: 14px;
}

/* CONTAINER */

.container {
    max-width: 1000px;
    margin: 30px auto;
    padding: 0 15px;
}

/* CARD */

.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

/* TITLE */

.title {
    color: #12355b;
    margin-top: 0;
}

/* MONTH */

.month-box {
    margin-bottom: 20px;
}

.month-box label {
    display: block;
    font-weight: bold;
    color: #12355b;
    margin-bottom: 7px;
}

.month-box select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

/* DEPARTMENT FOLDER */

.department {
    border: 1px solid #d5dce3;
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
}

.department-header {
    background: #eef4f9;
    padding: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #12355b;
    font-weight: bold;
}

.department-header:hover {
    background: #e2ebf3;
}

.department-name {
    display: flex;
    align-items: center;
    gap: 10px;
}

.arrow {
    font-size: 14px;
}

/* EMPLOYEE AREA */

.employee-area {
    display: none;
    padding: 12px;
    background: white;
}

/* EMPLOYEE FOLDER */

.employee {
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    margin-bottom: 8px;
    overflow: hidden;
}

.employee-header {
    padding: 12px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fafafa;
}

.employee-header:hover {
    background: #f0f4f7;
}

.employee-name {
    color: #12355b;
    font-weight: bold;
}

.employee-info {
    font-size: 12px;
    color: #666;
}

/* RECORD AREA */

.record-area {
    display: none;
    padding: 12px;
    overflow-x: auto;
}

/* TABLE */

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th {
    background: #12355b;
    color: white;
    padding: 10px;
    text-align: left;
    font-size: 13px;
}

td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    font-size: 13px;
}

/* STATUS */

.present {
    color: #16803c;
    font-weight: bold;
}

.absent {
    color: #d62828;
    font-weight: bold;
}

/* NO RECORD */

.no-record {
    padding: 15px;
    text-align: center;
    color: #777;
    font-size: 14px;
}

/* BACK BUTTON */

.back-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 11px 18px;
    background: #12355b;
    color: white;
    text-decoration: none;
    border-radius: 7px;
    font-weight: bold;
}

</style>

</head>


<body>


<header>

    <h1>Digital Attendance System</h1>

    <p>Attendance Record</p>

</header>


<div class="container">

<div class="card">

    <h2 class="title">
        Attendance Record
    </h2>


    <!-- MONTH SELECTOR -->

    <div class="month-box">

        <label>
            Select Month
        </label>

        <select id="monthSelect"
                onchange="loadAttendance()">

        </select>

    </div>


    <!-- DEPARTMENTS -->

    <div id="departmentContainer">

    </div>


    <a href="dashboard.html"
       class="back-btn">

        ← BACK TO DASHBOARD

    </a>

</div>

</div>


<script>

/* DEPARTMENTS */

const departments = [

    "BSCRIM",
    "BSIT",
    "BSHM",
    "BSED",
    "BSBA",
    "BEED"

];


/* LOAD EMPLOYEES */

function getEmployees() {

    return JSON.parse(
        localStorage.getItem("employees") || "[]"
    );

}


/* LOAD RECORDS */

function getRecords() {

    return JSON.parse(
        localStorage.getItem("attendanceRecords") || "[]"
    );

}


/* CREATE MONTH OPTIONS */

function createMonthOptions() {

    const select =
        document.getElementById("monthSelect");

    const now =
        new Date();

    const currentYear =
        now.getFullYear();

    const currentMonth =
        now.getMonth();


    select.innerHTML = "";


    for (
        let month = 0;
        month <= currentMonth;
        month++
    ) {

        const option =
            document.createElement("option");

        const value =
            currentYear + "-" +
            String(month + 1).padStart(2, "0");


        option.value =
            value;


        option.textContent =
            new Date(
                currentYear,
                month,
                1
            ).toLocaleString(
                "default",
                {
                    month: "long",
                    year: "numeric"
                }
            );


        select.appendChild(option);

    }


    select.value =
        currentYear + "-" +
        String(currentMonth + 1).padStart(2, "0");

}


/* LOAD ATTENDANCE */

function loadAttendance() {

    const container =
        document.getElementById(
            "departmentContainer"
        );


    container.innerHTML = "";


    const employees =
        getEmployees();


    const records =
        getRecords();


    const selectedMonth =
        document.getElementById(
            "monthSelect"
        ).value;


    /* CREATE DEPARTMENT FOLDERS */

    departments.forEach(function(department, departmentIndex) {

        const departmentBox =
            document.createElement("div");

        departmentBox.className =
            "department";


        const departmentHeader =
            document.createElement("div");

        departmentHeader.className =
            "department-header";


        departmentHeader.innerHTML = `

            <div class="department-name">

                <span>📁</span>

                <span>${department}</span>

            </div>

            <span class="arrow">
                ▶
            </span>

        `;


        const employeeArea =
            document.createElement("div");

        employeeArea.className =
            "employee-area";


        /* EMPLOYEES IN THIS DEPARTMENT */

        const departmentEmployees =
            employees
            .filter(function(employee) {

                return employee.department
                    === department;

            })
            .sort(function(a, b) {

                return a.name.localeCompare(
                    b.name
                );

            });


        if (
            departmentEmployees.length === 0
        ) {

            employeeArea.innerHTML = `

                <div class="no-record">
                    No registered employees.
                </div>

            `;

        }


        departmentEmployees.forEach(
            function(employee, employeeIndex) {


            const employeeBox =
                document.createElement("div");

            employeeBox.className =
                "employee";


            const employeeHeader =
                document.createElement("div");

            employeeHeader.className =
                "employee-header";


            employeeHeader.innerHTML = `

                <div>

                    <div class="employee-name">
                        👤 ${employee.name}
                    </div>

                    <div class="employee-info">
                        ID: ${employee.id}
                    </div>

                </div>

                <span class="arrow">
                    ▶
                </span>

            `;


            const recordArea =
                document.createElement("div");

            recordArea.className =
                "record-area";


            /* FIND EMPLOYEE RECORDS */

            const employeeRecords =
                records
                .filter(function(record) {

                    if (
                        String(record.employeeId)
                        .toLowerCase()
                        !==
                        String(employee.id)
                        .toLowerCase()
                    ) {

                        return false;

                    }


                    /*
                     USE attendanceDate
                     WHEN AVAILABLE
                    */

                    if (
                        record.attendanceDate
                    ) {

                        return record
                            .attendanceDate
                            .startsWith(
                                selectedMonth
                            );

                    }


                    return false;

                })
                .sort(function(a, b) {

                    return String(a.date)
                        .localeCompare(
                            String(b.date)
                        );

                });


            if (
                employeeRecords.length === 0
            ) {

                recordArea.innerHTML = `

                    <div class="no-record">
                        No attendance record for this month.
                    </div>

                `;

            } else {


                let tableHTML = `

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    Employee ID
                                </th>

                                <th>
                                    Employee Name
                                </th>

                                <th>
                                    Date
                                </th>

                                <th>
                                    Time In
                                </th>

                                <th>
                                    Time Out
                                </th>

                                <th>
                                    Status
                                </th>

                            </tr>

                        </thead>

                        <tbody>

                `;


                employeeRecords.forEach(
                    function(record) {


                    const statusClass =
                        record.status === "Present"
                        ? "present"
                        : "absent";


                    tableHTML += `

                        <tr>

                            <td>
                                ${record.employeeId}
                            </td>

                            <td>
                                ${record.employeeName}
                            </td>

                            <td>
                                ${record.date}
                            </td>

                            <td>
                                ${record.timeIn || "-"}
                            </td>

                            <td>
                                ${record.timeOut || "-"}
                            </td>

                            <td class="${statusClass}">
                                ${record.status || "-"}
                            </td>

                        </tr>

                    `;

                });


                tableHTML += `

                        </tbody>

                    </table>

                `;


                recordArea.innerHTML =
                    tableHTML;

            }


            /* EMPLOYEE CLICK */

            employeeHeader.addEventListener(
                "click",
                function() {

                    const isOpen =
                        recordArea.style.display
                        === "block";


                    recordArea.style.display =
                        isOpen
                        ? "none"
                        : "block";


                    const arrow =
                        employeeHeader
                        .querySelector(".arrow");


                    arrow.textContent =
                        isOpen
                        ? "▶"
                        : "▼";

                }
            );


            employeeBox.appendChild(
                employeeHeader
            );

            employeeBox.appendChild(
                recordArea
            );

            employeeArea.appendChild(
                employeeBox
            );

        });


        /* DEPARTMENT CLICK */

        departmentHeader.addEventListener(
            "click",
            function() {

                const isOpen =
                    employeeArea.style.display
                    === "block";


                employeeArea.style.display =
                    isOpen
                    ? "none"
                    : "block";


                const arrow =
                    departmentHeader
                    .querySelector(".arrow");


                arrow.textContent =
                    isOpen
                    ? "▶"
                    : "▼";

            }
        );


        departmentBox.appendChild(
            departmentHeader
        );

        departmentBox.appendChild(
            employeeArea
        );


        container.appendChild(
            departmentBox
        );

    });

}


/* START */

createMonthOptions();

loadAttendance();


/* REFRESH WHEN RETURNING TO PAGE */

window.addEventListener(
    "focus",
    loadAttendance
);

</script>


</body>

</html>
