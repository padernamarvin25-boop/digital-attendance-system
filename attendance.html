<!DOCTYPE html>
<html>
<head>
    <title>Attendance Records</title>
</head>

<body>

<h1>Attendance Records</h1>

<table border="1" width="100%" cellpadding="10">
    <thead>
        <tr>
            <th>Employee ID</th>
            <th>Employee Name</th>
            <th>Date</th>
            <th>Time In</th>
            <th>Time Out</th>
            <th>Status</th>
        </tr>
    </thead>

    <tbody id="attendanceTable">
    </tbody>
</table>

<br>

<a href="dashboard.html">BACK TO DASHBOARD</a>

<script>

let records = JSON.parse(
    localStorage.getItem("attendanceRecords")
) || [];

let table = document.getElementById("attendanceTable");

if (records.length === 0) {

    let row = table.insertRow();

    let cell = row.insertCell(0);

    cell.colSpan = 6;

    cell.innerHTML = "No attendance records yet.";

} else {

    records.forEach(function(record) {

        let row = table.insertRow();

        row.insertCell(0).innerHTML = record.employeeId;
        row.insertCell(1).innerHTML = record.employeeName;
        row.insertCell(2).innerHTML = record.date;
        row.insertCell(3).innerHTML = record.timeIn;
        row.insertCell(4).innerHTML =
            record.timeOut === "" ? "Not yet" : record.timeOut;
        row.insertCell(5).innerHTML = record.status;

    });

}

</script>

</body>
</html>
