<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Record</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f3f6fa;
            color: #222;
        }

        header {
            background: #12355b;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 14px;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
            color: #12355b;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th {
            background: #12355b;
            color: white;
            padding: 13px;
            text-align: center;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        tr:hover {
            background: #f5f8fc;
        }

        .present {
            color: #16803c;
            font-weight: bold;
        }

        .absent {
            color: #d62828;
            font-weight: bold;
        }

        .total-box {
            display: flex;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .total {
            flex: 1;
            min-width: 200px;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }

        .total-present {
            background: #e8f7ed;
            color: #16803c;
        }

        .total-absent {
            background: #fdeaea;
            color: #d62828;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            background: #12355b;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .back-btn:hover {
            background: #0d2946;
        }

        .no-record {
            text-align: center;
            padding: 25px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>Digital Attendance System</h1>
    <p>Faculty and Staff Attendance Record</p>
</header>

<div class="container">

    <div class="card">

        <h2>Attendance Record</h2>

        <div class="table-container">

            <table>
                <thead>
                    <tr>
                        <th>Employee ID</th>
                        <th>Employee Name</th>
                        <th>Date</th>
                        <th>Time In</th>
                        <th>Time Out</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="attendanceTable">
                </tbody>
            </table>

        </div>

        <div class="total-box">

            <div class="total total-present">
                TOTAL PRESENT:
                <span id="totalPresent">0</span>
            </div>

            <div class="total total-absent">
                TOTAL ABSENT:
                <span id="totalAbsent">0</span>
            </div>

        </div>

        <a href="dashboard.html" class="back-btn">
            ← BACK TO DASHBOARD
        </a>

    </div>

</div>

<script>

function loadAttendance() {

    const employees =
        JSON.parse(localStorage.getItem("employees")) || [];

    const records =
        JSON.parse(localStorage.getItem("attendanceRecords")) || [];

    const table =
        document.getElementById("attendanceTable");

    table.innerHTML = "";

    let totalPresent = 0;
    let totalAbsent = 0;

    /*
       Sort employees alphabetically
       Example:
       Ana
       Juan
       Maria
       Ryza
    */

    employees.sort(function(a, b) {
        return a.name.localeCompare(b.name);
    });

    if (employees.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="6" class="no-record">
                    No registered employees yet.
                </td>
            </tr>
        `;

        return;
    }

    employees.forEach(function(employee) {

        /*
           Get all attendance records
           belonging to this employee.
        */

        const employeeRecords = records.filter(function(record) {
            return record.employeeId.toLowerCase() ===
                   employee.id.toLowerCase();
        });

        /*
           If employee has attendance records,
           display them under one employee name.
        */

        if (employeeRecords.length > 0) {

            employeeRecords.forEach(function(record, index) {

                if (record.status === "Present") {
                    totalPresent++;
                }

                if (record.status === "Absent") {
                    totalAbsent++;
                }

                const row = document.createElement("tr");

                row.innerHTML = `

                    <td>
                        ${index === 0 ? employee.id : ""}
                    </td>

                    <td>
                        ${index === 0 ? employee.name : ""}
                    </td>

                    <td>
                        ${record.date || "-"}
                    </td>

                    <td>
                        ${record.timeIn || "-"}
                    </td>

                    <td>
                        ${record.timeOut || "-"}
                    </td>

                    <td class="${record.status === "Present" ? "present" : "absent"}">
                        ${record.status || "-"}
                    </td>

                `;

                table.appendChild(row);

            });

        } else {

            /*
               Employee has no attendance yet.
            */

            const row = document.createElement("tr");

            row.innerHTML = `

                <td>${employee.id}</td>

                <td>${employee.name}</td>

                <td>-</td>

                <td>-</td>

                <td>-</td>

                <td class="absent">
                    Absent
                </td>

            `;

            table.appendChild(row);

            totalAbsent++;
        }

    });

    document.getElementById("totalPresent").textContent =
        totalPresent;

    document.getElementById("totalAbsent").textContent =
        totalAbsent;
}

loadAttendance();

</script>

</body>
</html>
