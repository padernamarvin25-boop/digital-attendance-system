<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Records</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #2563eb;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            background: #555;
            color: white;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Attendance Records</h1>

    <table>
        <thead>
            <tr>
                <th>Employee ID</th>
                <th>Employee Name</th>
                <th>Date</th>
                <th>Time In</th>
                <th>Time Out</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="attendanceTable">
        </tbody>
    </table>

    <button onclick="goBack()">Back to Dashboard</button>

</div>

<script>

let attendance = JSON.parse(localStorage.getItem("attendance"));

let table = document.getElementById("attendanceTable");

if (attendance) {

    let row = table.insertRow();

    row.insertCell(0).innerHTML = attendance.employeeId;
    row.insertCell(1).innerHTML = attendance.employeeName;
    row.insertCell(2).innerHTML = attendance.date;
    row.insertCell(3).innerHTML = attendance.timeIn;
    row.insertCell(4).innerHTML = attendance.timeOut || "Not yet";
    row.insertCell(5).innerHTML = attendance.timeOut ? "Present" : "Time In";

} else {

    let row = table.insertRow();

    let cell = row.insertCell(0);
    cell.colSpan = 6;
    cell.innerHTML = "No attendance records yet.";

}

function goBack() {
    window.location.href = "dashboard.html";
}

</script>

</body>
</html>
