<!DOCTYPE html>
<html>
<head>
    <title>Employee Registration</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        h2 {
            color: #1e3a8a;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .save {
            background: #2563eb;
            color: white;
            margin-top: 20px;
            width: 100%;
        }

        .edit {
            background: #f59e0b;
            color: white;
        }

        .delete {
            background: #dc2626;
            color: white;
        }

        .table-box {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th {
            background: #1e3a8a;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        @media(max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Digital Attendance System</h1>
    <p>Employee Registration</p>
</div>

<div class="container">

    <div class="card">

        <h2>Register Employee</h2>

        <div class="form-grid">

            <input
                type="text"
                id="employeeId"
                placeholder="Employee ID">

            <input
                type="text"
                id="employeeName"
                placeholder="Employee Name">

            <input
                type="text"
                id="position"
                placeholder="Position">

            <input
                type="text"
                id="department"
                placeholder="Department">

        </div>

        <button
            class="save"
            id="saveButton"
            onclick="saveEmployee()">
            SAVE EMPLOYEE
        </button>

    </div>


    <div class="card">

        <h2>Registered Employees</h2>

        <div class="table-box">

            <table>

                <thead>
                    <tr>
                        <th>Employee ID</th>
                        <th>Name</th>
                        <th>Position</th>
                        <th>Department</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="employeeTable"></tbody>

            </table>

        </div>

    </div>

</div>


<script>

let editIndex = -1;


function saveEmployee() {

    let id =
        document.getElementById("employeeId").value.trim();

    let name =
        document.getElementById("employeeName").value.trim();

    let position =
        document.getElementById("position").value.trim();

    let department =
        document.getElementById("department").value.trim();


    if (
        id === "" ||
        name === "" ||
        position === "" ||
        department === ""
    ) {
        alert("Please complete all fields.");
        return;
    }


    let employees =
        JSON.parse(localStorage.getItem("employees")) || [];


    if (editIndex === -1) {

        let existing = employees.find(function(employee) {
            return employee.id === id;
        });

        if (existing) {
            alert("Employee ID already exists.");
            return;
        }

        employees.push({
            id: id,
            name: name,
            position: position,
            department: department
        });

        localStorage.setItem(
            "employees",
            JSON.stringify(employees)
        );

        alert("Employee registered successfully!");

        // AUTOMATICALLY GO TO TIME IN
        window.location.href = "timein.html";

    } else {

        employees[editIndex] = {
            id: id,
            name: name,
            position: position,
            department: department
        };

        localStorage.setItem(
            "employees",
            JSON.stringify(employees)
        );

        alert("Employee updated successfully!");

        editIndex = -1;

        document.getElementById("saveButton").innerHTML =
            "SAVE EMPLOYEE";

        clearForm();

        displayEmployees();
    }
}


function displayEmployees() {

    let employees =
        JSON.parse(localStorage.getItem("employees")) || [];

    let table =
        document.getElementById("employeeTable");

    table.innerHTML = "";


    employees.forEach(function(employee, index) {

        let row = table.insertRow();

        row.insertCell(0).innerHTML = employee.id;
        row.insertCell(1).innerHTML = employee.name;
        row.insertCell(2).innerHTML = employee.position;
        row.insertCell(3).innerHTML = employee.department;

        row.insertCell(4).innerHTML =
            '<button class="edit" onclick="editEmployee(' +
            index +
            ')">EDIT</button> ' +

            '<button class="delete" onclick="deleteEmployee(' +
            index +
            ')">DELETE</button>';
    });
}


function editEmployee(index) {

    let employees =
        JSON.parse(localStorage.getItem("employees")) || [];

    let employee = employees[index];

    document.getElementById("employeeId").value =
        employee.id;

    document.getElementById("employeeName").value =
        employee.name;

    document.getElementById("position").value =
        employee.position;

    document.getElementById("department").value =
        employee.department;

    editIndex = index;

    document.getElementById("saveButton").innerHTML =
        "UPDATE EMPLOYEE";
}


function deleteEmployee(index) {

    let employees =
        JSON.parse(localStorage.getItem("employees")) || [];

    let employee = employees[index];

    if (!confirm("Delete " + employee.name + "?")) {
        return;
    }

    employees.splice(index, 1);

    localStorage.setItem(
        "employees",
        JSON.stringify(employees)
    );

    displayEmployees();

    alert("Employee deleted successfully!");
}


function clearForm() {

    document.getElementById("employeeId").value = "";
    document.getElementById("employeeName").value = "";
    document.getElementById("position").value = "";
    document.getElementById("department").value = "";

    editIndex = -1;
}


displayEmployees();

</script>

</body>
</html>
