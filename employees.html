<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Registration</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f3f6fa;
}

header {
    background: #12355b;
    color: white;
    text-align: center;
    padding: 22px 15px;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 7px 0 0;
    font-size: 14px;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 15px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    margin-bottom: 25px;
}

h2 {
    color: #12355b;
    margin-top: 0;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
    color: #12355b;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #12355b;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #0d2946;
}

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #12355b;
    color: white;
    padding: 11px;
    text-align: left;
}

td {
    padding: 11px;
    border-bottom: 1px solid #ddd;
}

.action-btn {
    width: auto;
    margin: 2px;
    padding: 7px 10px;
    font-size: 12px;
}

.delete {
    background: #d62828;
}

.back-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 11px 18px;
    background: #12355b;
    color: white;
    text-decoration: none;
    border-radius: 7px;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>Digital Attendance System</h1>
    <p>Employee Registration</p>
</header>

<div class="container">

<div class="card">

    <h2>Register Employee</h2>

    <label>Employee ID</label>
    <input type="text" id="employeeId"
           placeholder="Enter Employee ID">

    <label>Employee Name</label>
    <input type="text" id="employeeName"
           placeholder="Enter Employee Name">

    <label>Position</label>
    <input type="text" id="position"
           placeholder="Enter Position">

    <label>Department</label>
    <input type="text" id="department"
           placeholder="Enter Department">

    <label>Personal Password</label>
    <input type="password" id="password"
           placeholder="Create Password">

    <button id="saveButton">
        SAVE EMPLOYEE
    </button>

</div>


<div class="card">

    <h2>Registered Employees</h2>

    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Position</th>
                    <th>Department</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="employeeTable"></tbody>

        </table>

    </div>

    <a href="dashboard.html" class="back-btn">
        ← BACK TO DASHBOARD
    </a>

</div>

</div>

<script>

let editIndex = -1;

const saveButton =
    document.getElementById("saveButton");


saveButton.addEventListener("click", function() {

    const id =
        document.getElementById("employeeId")
        .value.trim();

    const name =
        document.getElementById("employeeName")
        .value.trim();

    const position =
        document.getElementById("position")
        .value.trim();

    const department =
        document.getElementById("department")
        .value.trim();

    const password =
        document.getElementById("password")
        .value.trim();


    if (!id || !name || !position ||
        !department || !password) {

        return;
    }


    let employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );


    if (editIndex === -1) {

        const duplicate =
            employees.some(function(emp) {

                return String(emp.id).toLowerCase()
                    === id.toLowerCase();

            });


        if (duplicate) {
            return;
        }


        employees.push({

            id: id,
            name: name,
            position: position,
            department: department,
            password: password

        });


        localStorage.setItem(
            "employees",
            JSON.stringify(employees)
        );


        window.location.href = "timein.html";

    } else {

        employees[editIndex] = {

            id: id,
            name: name,
            position: position,
            department: department,
            password: password

        };


        localStorage.setItem(
            "employees",
            JSON.stringify(employees)
        );


        editIndex = -1;

        saveButton.textContent =
            "SAVE EMPLOYEE";

        clearForm();

        displayEmployees();

    }

});


function displayEmployees() {

    const employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );

    const table =
        document.getElementById("employeeTable");

    table.innerHTML = "";


    employees.forEach(function(emp, index) {

        const row =
            document.createElement("tr");

        row.innerHTML = `

            <td>${emp.id}</td>

            <td>${emp.name}</td>

            <td>${emp.position}</td>

            <td>${emp.department}</td>

            <td>

                <button
                    class="action-btn"
                    onclick="editEmployee(${index})">
                    Edit
                </button>

                <button
                    class="action-btn delete"
                    onclick="deleteEmployee(${index})">
                    Delete
                </button>

            </td>

        `;

        table.appendChild(row);

    });

}


function editEmployee(index) {

    const employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );

    const emp = employees[index];


    document.getElementById("employeeId").value =
        emp.id;

    document.getElementById("employeeName").value =
        emp.name;

    document.getElementById("position").value =
        emp.position;

    document.getElementById("department").value =
        emp.department;

    document.getElementById("password").value =
        emp.password || "";


    editIndex = index;

    saveButton.textContent =
        "UPDATE EMPLOYEE";

}


function deleteEmployee(index) {

    if (!confirm("Delete this employee?")) {
        return;
    }


    const employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );


    employees.splice(index, 1);


    localStorage.setItem(
        "employees",
        JSON.stringify(employees)
    );


    displayEmployees();

}


function clearForm() {

    document.getElementById("employeeId").value = "";

    document.getElementById("employeeName").value = "";

    document.getElementById("position").value = "";

    document.getElementById("department").value = "";

    document.getElementById("password").value = "";

}


displayEmployees();

</script>

</body>
</html>
