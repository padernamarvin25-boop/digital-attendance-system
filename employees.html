<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employee Registration</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f3f6fa;
}

header {
    background: #12355b;
    color: white;
    text-align: center;
    padding: 22px 15px;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 7px 0 0;
    font-size: 14px;
}

.container {
    max-width: 600px;
    margin: 35px auto;
    padding: 0 15px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

h2 {
    color: #12355b;
    margin-top: 0;
    text-align: center;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
    color: #12355b;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    background: white;
}

input:focus,
select:focus {
    border-color: #12355b;
}

/* PASSWORD */

.password-box {
    display: flex;
    gap: 8px;
}

.password-box input {
    flex: 1;
}

.eye-btn {
    width: 50px !important;
    margin-top: 0 !important;
    padding: 10px !important;
    background: #e9eef4 !important;
    color: #12355b !important;
    font-size: 18px !important;
    cursor: pointer;
}

/* SAVE BUTTON */

.save-btn {
    width: 100%;
    margin-top: 28px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #12355b;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.save-btn:hover {
    background: #0d2946;
}

/* BACK BUTTON */

.back-btn {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #12355b;
    text-decoration: none;
    font-weight: bold;
}

</style>
</head>

<body>

<header>

    <h1>Digital Attendance System</h1>

    <p>Employee Registration</p>

</header>


<div class="container">

<div class="card">

    <h2>Register Employee</h2>


    <!-- EMPLOYEE ID -->

    <label>Employee ID</label>

    <input
        type="text"
        id="employeeId"
        placeholder="Enter Employee ID"
        autocomplete="off"
    >


    <!-- EMPLOYEE NAME -->

    <label>Employee Name</label>

    <input
        type="text"
        id="employeeName"
        placeholder="Enter Employee Name"
        autocomplete="off"
    >


    <!-- POSITION -->

    <label>Position</label>

    <select id="position">

        <option value="">
            Select Position
        </option>

        <option value="Faculty">
            Faculty
        </option>

        <option value="Staff">
            Staff
        </option>

    </select>


    <!-- DEPARTMENT -->

    <label>Department</label>

    <select id="department">

        <option value="">
            Select Department
        </option>

        <option value="BSCRIM">
            BSCRIM
        </option>

        <option value="BSIT">
            BSIT
        </option>

        <option value="BSHM">
            BSHM
        </option>

        <option value="BSED">
            BSED
        </option>

        <option value="BSBA">
            BSBA
        </option>

        <option value="BEED">
            BEED
        </option>

    </select>


    <!-- PASSWORD -->

    <label>Personal Password</label>

    <div class="password-box">

        <input
            type="password"
            id="password"
            placeholder="Create Personal Password"
        >

        <button
            type="button"
            class="eye-btn"
            onclick="togglePassword()"
        >
            👁
        </button>

    </div>


    <!-- SAVE -->

    <button
        type="button"
        class="save-btn"
        onclick="saveEmployee()"
    >
        SAVE EMPLOYEE
    </button>


    <!-- BACK -->

    <a
        href="dashboard.html"
        class="back-btn"
    >
        ← BACK TO DASHBOARD
    </a>

</div>

</div>


<script>

/* SHOW / HIDE PASSWORD */

function togglePassword() {

    const password =
        document.getElementById("password");

    const button =
        document.querySelector(".eye-btn");


    if (password.type === "password") {

        password.type = "text";

        button.textContent = "🙈";

    } else {

        password.type = "password";

        button.textContent = "👁";

    }

}


/* SAVE EMPLOYEE */

function saveEmployee() {

    const id =
        document.getElementById("employeeId")
        .value.trim();

    const name =
        document.getElementById("employeeName")
        .value.trim();

    const position =
        document.getElementById("position")
        .value;

    const department =
        document.getElementById("department")
        .value;

    const password =
        document.getElementById("password")
        .value.trim();


    /* CHECK REQUIRED FIELDS */

    if (
        id === "" ||
        name === "" ||
        position === "" ||
        department === "" ||
        password === ""
    ) {

        return;

    }


    /* GET EXISTING EMPLOYEES */

    let employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );


    /* CHECK DUPLICATE ID */

    const duplicate =
        employees.some(function(employee) {

            return String(employee.id).toLowerCase()
                === id.toLowerCase();

        });


    if (duplicate) {

        return;

    }


    /* SAVE EMPLOYEE */

    employees.push({

        id: id,

        name: name,

        position: position,

        department: department,

        password: password

    });


    localStorage.setItem(
        "employees",
        JSON.stringify(employees)
    );


    /* DIRECTLY GO TO TIME IN */

    window.location.href = "timein.html";

}

</script>

</body>
</html>
