<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Registration</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f3f6fa;
}

header {
    background: #12355b;
    color: white;
    text-align: center;
    padding: 22px 15px;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 7px 0 0;
    font-size: 14px;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 15px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    margin-bottom: 25px;
}

h2 {
    color: #12355b;
    margin-top: 0;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
    color: #12355b;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    background: white;
}

input:focus,
select:focus {
    border-color: #12355b;
}

.password-box {
    display: flex;
    gap: 8px;
}

.password-box input {
    flex: 1;
}

.eye-btn {
    width: 50px !important;
    margin-top: 0 !important;
    padding: 10px !important;
    background: #e9eef4 !important;
    color: #12355b !important;
    font-size: 18px !important;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #12355b;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #0d2946;
}

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #12355b;
    color: white;
    padding: 11px;
    text-align: left;
}

td {
    padding: 11px;
    border-bottom: 1px solid #ddd;
}

.action-btn {
    width: auto;
    margin: 2px;
    padding: 7px 10px;
    font-size: 12px;
}

.delete {
    background: #d62828;
}

.delete:hover {
    background: #b71f1f;
}

.back-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 11px 18px;
    background: #12355b;
    color: white;
    text-decoration: none;
    border-radius: 7px;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>Digital Attendance System</h1>
    <p>Employee Registration</p>
</header>

<div class="container">

<div class="card">

    <h2>Register Employee</h2>

    <label>Employee ID</label>
    <input
        type="text"
        id="employeeId"
        placeholder="Enter Employee ID">

    <label>Employee Name</label>
    <input
        type="text"
        id="employeeName"
        placeholder="Enter Employee Name">

    <label>Position</label>

    <select id="position">
        <option value="">Select Position</option>
        <option value="Faculty">Faculty</option>
        <option value="Staff">Staff</option>
    </select>


    <label>Department</label>

    <select id="department">
        <option value="">Select Department</option>
        <option value="BSCRIM">BSCRIM</option>
        <option value="BSIT">BSIT</option>
        <option value="BSHM">BSHM</option>
        <option value="BSED">BSED</option>
        <option value="BSBA">BSBA</option>
        <option value="BEED">BEED</option>
    </select>


    <label>Personal Password</label>

    <div class="password-box">

        <input
            type="password"
            id="password"
            placeholder="Create Password">

        <button
            type="button"
            class="eye-btn"
            onclick="togglePassword('password', this)">
            👁
        </button>

    </div>


    <button id="saveButton">
        SAVE EMPLOYEE
    </button>

</div>


<div class="card">

    <h2>Registered Employees</h2>

    <div class="table-container">

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Position</th>
                    <th>Department</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="employeeTable"></tbody>

        </table>

    </div>


    <a href="dashboard.html" class="back-btn">
        ← BACK TO DASHBOARD
    </a>

</div>

</div>


<script>

let editIndex = -1;

const saveButton =
    document.getElementById("saveButton");


/* VIEW / HIDE PASSWORD */

function togglePassword(id, button) {

    const input =
        document.getElementById(id);

    if (input.type === "password") {

        input.type = "text";

        button.textContent = "🙈";

    } else {

        input.type = "password";

        button.textContent = "👁";

    }

}


/* SAVE EMPLOYEE */

saveButton.addEventListener("click", function() {

    const id =
        document.getElementById("employeeId")
        .value.trim();

    const name =
        document.getElementById("employeeName")
        .value.trim();

    const position =
        document.getElementById("position")
        .value;

    const department =
        document.getElementById("department")
        .value;

    const password =
        document.getElementById("password")
        .value.trim();


    /* CHECK EMPTY FIELDS */

    if (
        !id ||
        !name ||
        !position ||
        !department ||
        !password
    ) {

        return;

    }


    let employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );


    /* ADD NEW EMPLOYEE */

    if (editIndex === -1) {

        const duplicate =
            employees.some(function(emp) {

                return String(emp.id).toLowerCase()
                    === id.toLowerCase();

            });


        if (duplicate) {

            return;

        }


        employees.push({

            id: id,

            name: name,

            position: position,

            department: department,

            password: password

        });


        localStorage.setItem(
            "employees",
            JSON.stringify(employees)
        );


        /* DIRECTLY GO TO TIME IN */

        window.location.href = "timein.html";


    } else {


        /* UPDATE EMPLOYEE */

        employees[editIndex] = {

            id: id,

            name: name,

            position: position,

            department: department,

            password: password

        };


        localStorage.setItem(
            "employees",
            JSON.stringify(employees)
        );


        editIndex = -1;

        saveButton.textContent =
            "SAVE EMPLOYEE";

        clearForm();

        displayEmployees();

    }

});


/* DISPLAY EMPLOYEES */

function displayEmployees() {

    const employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );

    const table =
        document.getElementById("employeeTable");

    table.innerHTML = "";


    employees.forEach(function(emp, index) {

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>${emp.id}</td>

            <td>${emp.name}</td>

            <td>${emp.position}</td>

            <td>${emp.department}</td>

            <td>

                <button
                    class="action-btn"
                    onclick="editEmployee(${index})">
                    Edit
                </button>

                <button
                    class="action-btn delete"
                    onclick="deleteEmployee(${index})">
                    Delete
                </button>

            </td>

        `;


        table.appendChild(row);

    });

}


/* EDIT EMPLOYEE */

function editEmployee(index) {

    const employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );


    const emp =
        employees[index];


    document.getElementById("employeeId").value =
        emp.id;

    document.getElementById("employeeName").value =
        emp.name;

    document.getElementById("position").value =
        emp.position;

    document.getElementById("department").value =
        emp.department;

    document.getElementById("password").value =
        emp.password || "";


    editIndex = index;


    saveButton.textContent =
        "UPDATE EMPLOYEE";

}


/* DELETE EMPLOYEE */

function deleteEmployee(index) {

    if (!confirm("Delete this employee?")) {

        return;

    }


    const employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );


    employees.splice(index, 1);


    localStorage.setItem(
        "employees",
        JSON.stringify(employees)
    );


    displayEmployees();

}


/* CLEAR FORM */

function clearForm() {

    document.getElementById("employeeId").value = "";

    document.getElementById("employeeName").value = "";

    document.getElementById("position").value = "";

    document.getElementById("department").value = "";

    document.getElementById("password").value = "";

}


/* LOAD EMPLOYEES */

displayEmployees();

</script>

</body>
</html>
