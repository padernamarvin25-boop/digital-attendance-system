<!DOCTYPE html>
<html>
<head>
    <title>Employee Registration</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0 0 8px;
        }

        .container {
            max-width: 950px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        h2 {
            color: #1e3a8a;
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .save-button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-button:hover {
            background: #1d4ed8;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th {
            background: #1e3a8a;
            color: white;
            padding: 13px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;
        }

        .edit-button {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .delete-button {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .empty {
            text-align: center;
            color: #6b7280;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Digital Attendance System</h1>
    <p>Faculty and Staff Employee Registration</p>
</div>

<div class="container">

    <div class="card">

        <h2>Register Employee</h2>

        <div class="form-grid">

            <input
                type="text"
                id="employeeId"
                placeholder="Employee ID">

            <input
                type="text"
                id="employeeName"
                placeholder="Employee Name">

            <input
                type="text"
                id="position"
                placeholder="Position">

            <input
                type="text"
                id="department"
                placeholder="Department">

        </div>

        <button
            type="button"
            class="save-button"
            id="saveButton">
            SAVE EMPLOYEE
        </button>

    </div>

    <div class="card">

        <h2>Registered Employees</h2>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Employee ID</th>
                        <th>Employee Name</th>
                        <th>Position</th>
                        <th>Department</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="employeeTable"></tbody>

            </table>

        </div>

    </div>

</div>

<script>

let editIndex = -1;


/* SAVE / UPDATE */

document.getElementById("saveButton").addEventListener("click", function() {

    let id =
        document.getElementById("employeeId").value.trim();

    let name =
        document.getElementById("employeeName").value.trim();

    let position =
        document.getElementById("position").value.trim();

    let department =
        document.getElementById("department").value.trim();


    if (
        id === "" ||
        name === "" ||
        position === "" ||
        department === ""
    ) {
        return;
    }


    let employees =
        JSON.parse(localStorage.getItem("employees")) || [];


    /* NEW EMPLOYEE */

    if (editIndex === -1) {

        let existing =
            employees.find(function(employee) {
                return employee.id === id;
            });


        if (existing) {
            return;
        }


        employees.push({
            id: id,
            name: name,
            position: position,
            department: department
        });


        localStorage.setItem(
            "employees",
            JSON.stringify(employees)
        );


        /* DIRECT TO TIME IN */

        window.location.href = "timein.html";

        return;
    }


    /* EDIT EMPLOYEE */

    employees[editIndex] = {
        id: id,
        name: name,
        position: position,
        department: department
    };


    localStorage.setItem(
        "employees",
        JSON.stringify(employees)
    );


    editIndex = -1;

    document.getElementById("saveButton").innerHTML =
        "SAVE EMPLOYEE";

    clearForm();

    displayEmployees();

});


/* DISPLAY EMPLOYEES */

function displayEmployees() {

    let employees =
        JSON.parse(localStorage.getItem("employees")) || [];

    let table =
        document.getElementById("employeeTable");

    table.innerHTML = "";


    if (employees.length === 0) {

        let row = table.insertRow();

        let cell = row.insertCell(0);

        cell.colSpan = 5;

        cell.className = "empty";

        cell.innerHTML =
            "No registered employees yet.";

        return;
    }


    employees.forEach(function(employee, index) {

        let row = table.insertRow();

        row.insertCell(0).innerHTML =
            employee.id;

        row.insertCell(1).innerHTML =
            employee.name;

        row.insertCell(2).innerHTML =
            employee.position;

        row.insertCell(3).innerHTML =
            employee.department;

        row.insertCell(4).innerHTML =
            '<button class="edit-button" onclick="editEmployee(' +
            index +
            ')">EDIT</button> ' +

            '<button class="delete-button" onclick="deleteEmployee(' +
            index +
            ')">DELETE</button>';

    });
}


/* EDIT */

function editEmployee(index) {

    let employees =
        JSON.parse(localStorage.getItem("employees")) || [];

    let employee =
        employees[index];


    document.getElementById("employeeId").value =
        employee.id;

    document.getElementById("employeeName").value =
        employee.name;

    document.getElementById("position").value =
        employee.position;

    document.getElementById("department").value =
        employee.department;


    editIndex = index;


    document.getElementById("saveButton").innerHTML =
        "UPDATE EMPLOYEE";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* DELETE */

function deleteEmployee(index) {

    let employees =
        JSON.parse(localStorage.getItem("employees")) || [];

    employees.splice(index, 1);

    localStorage.setItem(
        "employees",
        JSON.stringify(employees)
    );

    displayEmployees();

}


/* CLEAR */

function clearForm() {

    document.getElementById("employeeId").value = "";
    document.getElementById("employeeName").value = "";
    document.getElementById("position").value = "";
    document.getElementById("department").value = "";

    editIndex = -1;

}


/* LOAD */

displayEmployees();

</script>

</body>
</html>
