<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Out</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f3f6fa;
}

header {
    background: #12355b;
    color: white;
    text-align: center;
    padding: 22px 15px;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 7px 0 0;
    font-size: 14px;
}

.container {
    max-width: 600px;
    margin: 35px auto;
    padding: 0 15px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

h2 {
    color: #12355b;
    margin-top: 0;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
    color: #12355b;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

input[readonly] {
    background: #f1f3f5;
}

.password-box {
    display: flex;
    gap: 8px;
}

.password-box input {
    flex: 1;
}

.eye-btn {
    width: 50px !important;
    margin-top: 0 !important;
    padding: 10px !important;
    background: #e9eef4 !important;
    color: #12355b !important;
    font-size: 18px !important;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #d62828;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #b71f1f;
}

#result {
    display: none;
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
}

.back-btn {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #12355b;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>Digital Attendance System</h1>
    <p>Faculty and Staff Time Out</p>
</header>

<div class="container">

<div class="card">

    <h2>Employee Time Out</h2>

    <label>Employee ID</label>

    <input
        type="text"
        id="employeeId"
        placeholder="Enter Employee ID"
        autocomplete="off">

    <label>Password</label>

    <div class="password-box">

        <input
            type="password"
            id="password"
            placeholder="Enter Personal Password">

        <button
            type="button"
            class="eye-btn"
            onclick="togglePassword('password', this)">
            👁
        </button>

    </div>

    <label>Employee Name</label>

    <input
        type="text"
        id="employeeName"
        placeholder="Employee name"
        readonly>

    <button type="button" id="timeOutButton">
        TIME OUT
    </button>

    <div id="result"></div>

    <a href="dashboard.html" class="back-btn">
        ← BACK TO DASHBOARD
    </a>

</div>

</div>

<script>

const idInput =
    document.getElementById("employeeId");

const passwordInput =
    document.getElementById("password");

const nameInput =
    document.getElementById("employeeName");

const button =
    document.getElementById("timeOutButton");

const result =
    document.getElementById("result");


/* VIEW / HIDE PASSWORD */

function togglePassword(id, button) {

    const input =
        document.getElementById(id);

    if (input.type === "password") {

        input.type = "text";
        button.textContent = "🙈";

    } else {

        input.type = "password";
        button.textContent = "👁";

    }
}


/* TODAY */

function getToday() {

    const now = new Date();

    return now.getFullYear() +
        "-" +
        String(now.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(now.getDate()).padStart(2, "0");
}


/* VERIFY EMPLOYEE */

function verifyEmployee() {

    const id =
        idInput.value.trim();

    const password =
        passwordInput.value;

    nameInput.value = "";

    if (!id || !password) {
        return null;
    }


    const employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );


    const employee =
        employees.find(function(emp) {

            return (
                String(emp.id).toLowerCase()
                === id.toLowerCase()
                &&
                String(emp.password)
                === password
            );

        });


    if (employee) {

        nameInput.value =
            employee.name;

        return employee;

    }


    return null;
}


/* MESSAGE */

function showMessage(message, success) {

    result.style.display = "block";

    result.textContent = message;

    if (success) {

        result.style.background = "#e8f7ed";
        result.style.color = "#16803c";

    } else {

        result.style.background = "#fdeaea";
        result.style.color = "#d62828";

    }
}


/* TIME OUT */

function timeOut() {

    const employee =
        verifyEmployee();


    if (!employee) {

        showMessage(
            "Invalid Employee ID or Password.",
            false
        );

        return;
    }


    const today =
        getToday();


    let records =
        JSON.parse(
            localStorage.getItem("attendanceRecords") || "[]"
        );


    const recordIndex =
        records.findIndex(function(record) {

            return (
                String(record.employeeId).toLowerCase()
                === String(employee.id).toLowerCase()
                &&
                record.attendanceDate === today
            );

        });


    if (recordIndex === -1) {

        showMessage(
            "No Time In record found for today.",
            false
        );

        return;
    }


    const record =
        records[recordIndex];


    if (record.timeOut !== "") {

        showMessage(
            employee.name +
            " already has a Time Out record today.",
            false
        );

        return;
    }


    const now = new Date();


    record.timeOut =
        now.toLocaleTimeString();

    record.status =
        "Present";


    records[recordIndex] =
        record;


    localStorage.setItem(
        "attendanceRecords",
        JSON.stringify(records)
    );


    showMessage(
        employee.name +
        " successfully timed out at " +
        now.toLocaleTimeString(),
        true
    );


    idInput.value = "";

    passwordInput.value = "";

    nameInput.value = "";

}

button.addEventListener(
    "click",
    timeOut
);

</script>

</body>
</html>
