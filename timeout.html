<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Time Out</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f3f6fa;
}

header {
    background: #12355b;
    color: white;
    text-align: center;
    padding: 22px 15px;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 7px 0 0;
    font-size: 14px;
}

.container {
    max-width: 600px;
    margin: 35px auto;
    padding: 0 15px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

.card h2 {
    color: #12355b;
    margin-top: 0;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
    color: #12355b;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #12355b;
}

input[readonly] {
    background: #f1f3f5;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #d62828;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    display: block;
    position: relative;
    z-index: 10;
}

button:hover {
    background: #b71f1f;
}

button:active {
    transform: scale(0.99);
}

#result {
    display: none;
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
}

.back-btn {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #12355b;
    text-decoration: none;
    font-weight: bold;
}

.back-btn:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<header>
    <h1>Digital Attendance System</h1>
    <p>Faculty and Staff Time Out</p>
</header>

<div class="container">

    <div class="card">

        <h2>Employee Time Out</h2>

        <label for="employeeId">
            Employee ID
        </label>

        <input
            type="text"
            id="employeeId"
            placeholder="Enter Employee ID"
            autocomplete="off"
        >

        <label for="employeeName">
            Employee Name
        </label>

        <input
            type="text"
            id="employeeName"
            placeholder="Employee name"
            readonly
        >

        <button type="button" id="timeOutButton">
            TIME OUT
        </button>

        <div id="result"></div>

        <a href="dashboard.html" class="back-btn">
            ← BACK TO DASHBOARD
        </a>

    </div>

</div>

<script>

const employeeIdInput =
    document.getElementById("employeeId");

const employeeNameInput =
    document.getElementById("employeeName");

const timeOutButton =
    document.getElementById("timeOutButton");

const result =
    document.getElementById("result");


/* GET TODAY */

function getToday() {

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(now.getMonth() + 1)
        .padStart(2, "0");

    const day =
        String(now.getDate())
        .padStart(2, "0");

    return year + "-" + month + "-" + day;
}


/* FIND EMPLOYEE */

function findEmployee() {

    const id =
        employeeIdInput.value.trim();

    employeeNameInput.value = "";

    if (id === "") {
        return;
    }

    const employees =
        JSON.parse(
            localStorage.getItem("employees") || "[]"
        );

    const employee =
        employees.find(function(emp) {

            return String(emp.id).toLowerCase() ===
                   id.toLowerCase();

        });

    if (employee) {

        employeeNameInput.value =
            employee.name;

    }
}


/* SHOW MESSAGE */

function showMessage(message, success) {

    result.style.display = "block";

    result.textContent = message;

    if (success) {

        result.style.background = "#e8f7ed";
        result.style.color = "#16803c";

    } else {

        result.style.background = "#fdeaea";
        result.style.color = "#d62828";

    }
}


/* TIME OUT */

function timeOut() {

    const id =
        employeeIdInput.value.trim();

    const name =
        employeeNameInput.value.trim();


    if (id === "" || name === "") {

        showMessage(
            "Please enter a valid Employee ID.",
            false
        );

        return;
    }


    const today = getToday();


    let records =
        JSON.parse(
            localStorage.getItem("attendanceRecords") || "[]"
        );


    /*
       FIND TODAY'S TIME IN RECORD
    */

    const recordIndex =
        records.findIndex(function(record) {

            return (
                String(record.employeeId).toLowerCase() ===
                id.toLowerCase() &&

                record.attendanceDate === today
            );

        });


    /* NO TIME IN TODAY */

    if (recordIndex === -1) {

        showMessage(
            "No Time In record found for today.",
            false
        );

        return;
    }


    const record =
        records[recordIndex];


    /* PREVENT DOUBLE TIME OUT */

    if (record.timeOut !== "") {

        showMessage(
            name +
            " already has a Time Out record today.",
            false
        );

        return;
    }


    /* SAVE TIME OUT */

    const now = new Date();

    record.timeOut =
        now.toLocaleTimeString();

    record.status =
        "Present";


    records[recordIndex] =
        record;


    localStorage.setItem(
        "attendanceRecords",
        JSON.stringify(records)
    );


    /* SUCCESS MESSAGE */

    showMessage(
        name +
        " successfully timed out at " +
        now.toLocaleTimeString(),
        true
    );


    /* CLEAR INPUT */

    employeeIdInput.value = "";

    employeeNameInput.value = "";

}


/* FIND NAME WHILE TYPING */

employeeIdInput.addEventListener(
    "input",
    findEmployee
);


/* TIME OUT BUTTON */

timeOutButton.addEventListener(
    "click",
    timeOut
);

</script>

</body>
</html>
